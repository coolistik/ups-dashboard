        const stripPivotCacheFromXlsx = (u8) => {
            try {
                const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
                let eocdPos = -1;
                for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {

                const cdOffset = dv.getUint32(eocdPos + 16, true);

                const kept = [];
                let newLocalSize = 0;
                let newCdSize = 0;
                let hasPivot = false;

                for (let i = 0; i < totalEntries; i++) {
                    if (dv.getUint32(ptr, true) !== 0x02014b50) return u8;
                    const fnLen = dv.getUint16(ptr + 28, true);
                    const extraLen = dv.getUint16(ptr + 30, true);
                    const commentLen = dv.getUint16(ptr + 32, true);
                    const localHdrOffset = dv.getUint32(ptr + 42, true);
                    const fn = td.decode(u8.subarray(ptr + 46, ptr + 46 + fnLen));
                    const cdEntryLen = 46 + fnLen + extraLen + commentLen;

                    if (dv.getUint32(localHdrOffset, true) !== 0x04034b50) return u8;
                    const lFnLen = dv.getUint16(localHdrOffset + 26, true);
                    const lExtraLen = dv.getUint16(localHdrOffset + 28, true);
                    const compSize = dv.getUint32(localHdrOffset + 18, true);
                    const flags = dv.getUint16(localHdrOffset + 6, true);
                    const actualCompSize = (flags & 8) ? dv.getUint32(ptr + 20, true) : compSize;
                    const localTotalLen = 30 + lFnLen + lExtraLen + actualCompSize;

                    if (fn.startsWith('xl/pivotCache/') || fn.startsWith('xl/pivotTables/')) {
                        hasPivot = true;
                    } else {
                        kept.push({
                            cdStart: ptr,
                            cdLen: cdEntryLen,
                            localStart: localHdrOffset,
                            localLen: localTotalLen,
                            newLocalOffset: newLocalSize
                        });
                        newLocalSize += localTotalLen;
                        newCdSize += cdEntryLen;
                    }
                    ptr += cdEntryLen;

                if (!hasPivot) return u8;

                const outDv = new DataView(out.buffer);
                let outPos = 0;
                for (const item of kept) {
                    out.set(u8.subarray(item.localStart, item.localStart + item.localLen), outPos);

                }

                for (const item of kept) {

            if (commit === '09:00' || upper.includes('EARLY') || upper.includes('PLUS') || upper.includes('09:00')) return '0900';
            if (commit === '10:30' || upper.includes('10:30')) return '1030';
            if (commit === '12:00' || commit === '14:00' || upper.includes('NEXT DAY') || upper.includes('12:00')) return '1200';
            if (upper.includes('EXPRESS') && !upper.includes('SAVER')) return 'OTHER';
            return null;
        };

        const getMarkerColor = (serviceType, commit) => {
            const cat = getExpressCategory(serviceType, commit);
            if (cat === '0900') return '#dc2626';
            if (cat === '1030') return '#8b5cf6';
            if (cat === '1200') return '#f97316';
            if (cat === 'OTHER') return '#ec4899';

            const upper = (serviceType || '').toUpperCase();
            if (upper.includes('INTERNATIONAL')) return '#16a34a';
            if (upper.includes('SAVER')) return '#eab308';
            return '#3b82f6';
        };

        const getExpressColorClass = (commit, state) => {

            if (state === 'Ausnahme') return 'bg-gray-50 border-gray-300 text-gray-500';
            if (commit === '09:00') return 'bg-red-50 border-red-200 border-l-4 border-l-[#dc2626] text-red-900';
            if (commit === '10:30') return 'bg-purple-50 border-purple-200 border-l-4 border-l-[#8b5cf6] text-purple-900';
            if (commit === '12:00' || commit === '14:00') return 'bg-orange-50 border-orange-200 border-l-4 border-l-[#f97316] text-orange-900';
            return 'bg-pink-50 border-pink-200 border-l-4 border-l-[#ec4899] text-pink-900';
        };

        const calculateDistanceAndDriveTime = (lat1, lon1, lat2, lon2) => {
            if (!lat1 || !lon1 || !lat2 || !lon2 || (lat1 === 0 && lon1 === 0) || (lat2 === 0 && lon2 === 0)) return { distanceKm: 0, driveTime: 0 };
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distanceKm = R * c;
            const driveTime = Math.ceil((distanceKm / 25) * 60);
            return { distanceKm, driveTime };
        };

        const exportCSV = (filename, rows) => {
            if (!rows || !rows.length) return;
            const separator = ';';
            const keys = Object.keys(rows[0]);
            const csvContent = "data:text/csv;charset=utf-8,\uFEFF" +
                keys.join(separator) + '\n' +
                rows.map(row => keys.map(k => {
                    let cell = row[k] === null || row[k] === undefined ? '' : row[k];
                    cell = cell.toString().replace(/"/g, '""');
                    if (cell.search(/("|,|;|\n)/g) >= 0) cell = '"' + cell + '"';
                    return cell;
                }).join(separator)).join('\n');
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", filename + ".csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

                            if (res.ok) {
                                const json = await res.json();
                                if (json.status === 'OK' && json.results.length > 0) {
                                    planLat = json.results[0].geometry.location.lat;
                                    planLng = json.results[0].geometry.location.lng;
                                } else if (json.status === 'REQUEST_DENIED' || json.status === 'OVER_QUERY_LIMIT') {
                                    console.error('Google API Error:', json.status, json.error_message);

                            if (res.ok) {
                                const json = await res.json();
                                if (json && json.features && json.features.length > 0) {

                            }
                        }

                        if (planLat && planLng) {
                            const R = 6371e3;
                            const phi1 = stop.lat * Math.PI / 180;
                            const phi2 = planLat * Math.PI / 180;
                            const dphi = (planLat - stop.lat) * Math.PI / 180;
                            const dlambda = (planLng - stop.lng) * Math.PI / 180;
                            const aa = Math.sin(dphi / 2) ** 2 + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dlambda / 2) ** 2;
                            const distance = Math.round(R * 2 * Math.atan2(Math.sqrt(aa), Math.sqrt(1 - aa)));

                            if (distance >= gpsTolerance) {

                            const headers = Object.keys(row);
                            const colSValue = row[headers[18]] || ''; // 19th column (S)

                            let commitStr = 'EOD';

                                endStr: row['Stop Complete Time HHMMSS'],
                                startTime: new Date(row['Stop Start Time HHMMSS']).getTime(),
                                endTime: new Date(row['Stop Complete Time HHMMSS']).getTime(),
                                lat: parseFloat(row['Trigger 3 GPS Latitude']),
                                lng: parseFloat(row['Trigger 3 GPS Longitude']),
                                city: row['City Name'],
                                postalCode: row['Postal Code'] || row['Consignee Postal Code'] || '',
                                street: row['Street Name'],
                                house: row['Street Num'],
                                service: srv,
                                commit: commitStr,
                                isExpress: isExpress(srv) || commitStr !== 'EOD',
                                status: row['Deliv Stop Classification Desc'] || '',
                                type: row['Stop Type Desc'] || '',
                                pickupAccept: row['ODS Pickup Accept Time HHMMSS'],
                                pickupReady: row['ODS Pickup Ready Time HHMMSS'],
                                commercial: parseInt(row['Stop Commercial Identity Ind'], 10) || 0,
                                isForecast: false
                            };
                        }).filter(r => !isNaN(r.lat) && !isNaN(r.lng) && r.tour);
                        combinedData = combinedData.concat(processed);
                    }
                    setLoadingProgress(20 + Math.round(((i + 1) / files.length) * 40));
                }

                setIsForecastMode(hasForecast);

                // Функция привязки координат из БД (SQLite / IndexedDB / DEFAULT_PLZ_COORDS)
                const applyCoordsToForecast = (rowsList, dict) => {
                    return rowsList.map(d => {
                        if (d.isForecast) {
                            const normKey = normalizeAddressKey(d.street, d.postalCode, d.city);
                            const legacyKey = `${(d.street || '').replace(/\*/g, 's')} ${d.postalCode || ''} ${d.city || ''}`.trim();
                            const hit = dict[normKey] || dict[legacyKey];
                            if (hit && hit.lat && hit.lng) {
                                d.lat = hit.lat + ((d.seq % 7) - 3) * 0.00008;
                                d.lng = hit.lng + ((d.seq % 5) - 2) * 0.00008;
                            } else {
                                const defaultFallback = DEFAULT_PLZ_COORDS[d.postalCode] || DEFAULT_PLZ_COORDS['01067'] || { lat: 51.0507, lng: 13.7373 };
                                const seqIndex = d.seq || 1;
                                const radius = 0.004 + (Math.sqrt(seqIndex) % 18) * 0.0009;
                                const angle = seqIndex * 2.39996;
                                d.lat = defaultFallback.lat + radius * Math.cos(angle);
                                d.lng = defaultFallback.lng + radius * Math.sin(angle) * 1.4;
                            }
                        }
                        return d;
                    }).filter(d => (!d.isForecast) || (d.isForecast && !!d.lat));
                };

                if (hasForecast) {
                    combinedData = applyCoordsToForecast(combinedData, coordsDict);
                }

                // Мгновенно отображаем данные в дашборде (не блокируя интерфейс сетевым геокодингом!)
                const uniqueTours = [...new Set(combinedData.map(r => r.tour))].sort();
                setData(combinedData);
                setTours(uniqueTours);
                setSelectedTours(uniqueTours);
                setIdleTourFilter('Alle');
                setLoadingStatus('Fertig!');
                setLoadingProgress(100);

                try {
                    await GeoDB.saveReport('current_ups_data', combinedData, currentUploadName, hasForecast);
                } catch (err) {
                    console.error('Failed to save persistence data', err);
                }

                // Если в файле прогноза есть новые адреса, которых ещё нет в БД ups_cache.db, догеокодируем их в фоне
                if (hasForecast) {
                    const missingAddrs = [...new Set(combinedData.filter(d => d.isForecast).map(d => {
                        const normKey = normalizeAddressKey(d.street, d.postalCode, d.city);
                        const legacyKey = `${(d.street || '').replace(/\*/g, 's')} ${d.postalCode || ''} ${d.city || ''}`.trim();
                        if (coordsDict[normKey] || coordsDict[legacyKey]) return null;
                        return normKey;
                    }).filter(Boolean))];

                    if (missingAddrs.length > 0) {
                        const maxGCalls = Math.min(missingAddrs.length, 300);
                        const CHUNK_SIZE = 6;
                        let addrsProcessed = 0;
                        const newGeoEntries = {};

                        for (let i = 0; i < maxGCalls; i += CHUNK_SIZE) {
                            const chunk = missingAddrs.slice(i, Math.min(i + CHUNK_SIZE, maxGCalls));
                            await Promise.all(chunk.map(async (addrKey) => {
                                try {
                                    const ctrl = new AbortController();
                                    const timer = setTimeout(() => ctrl.abort(), 3500);
                                    const qRaw = encodeURIComponent(addrKey + ', Germany');
                                    const res = await fetch(`https://photon.komoot.io/api/?q=${qRaw}&limit=1`, { signal: ctrl.signal });
                                    clearTimeout(timer);
                                    if (res.ok) {
                                        const json = await res.json();
                                        if (json && json.features && json.features.length > 0) {
                                            const coords = json.features[0].geometry.coordinates;
                                            const val = { lat: coords[1], lng: coords[0] };
                                            coordsDict[addrKey] = val;
                                            newGeoEntries[addrKey] = val;
                                        }
                                    }
                                } catch (_) {}
                                addrsProcessed++;
                            }));

                            setLoadingStatus(`Hintergrund-Geocoding... ${addrsProcessed}/${maxGCalls}`);
                            setLoadingProgress(Math.round((addrsProcessed / maxGCalls) * 100));

                            if (Object.keys(newGeoEntries).length > 0) {
                                await GeoDB.setBulk({ ...newGeoEntries });
                                Object.keys(newGeoEntries).forEach(k => delete newGeoEntries[k]);
                            }
                            if (i + CHUNK_SIZE < maxGCalls) {
                                await new Promise(r => setTimeout(r, 350));
                            }
                        }

                        setPlzCoordsCache({ ...coordsDict });
                        const updatedData = applyCoordsToForecast([...combinedData], coordsDict);
                        setData(updatedData);
                        await GeoDB.saveReport('current_ups_data', updatedData, currentUploadName, hasForecast);
                    }
                }

                setTimeout(() => {
                    setLoadingStatus('');
                    setLoadingProgress(0);
                }, 800);
            };

            const toggleTourSelection = (tour) => {
                setSelectedTours(prev => {
                    if (prev.includes(tour)) {
                        return prev.length > 1 ? prev.filter(t => t !== tour) : prev;
                    } else {
                        return [...prev, tour];
                    }
                });
            };

            const clearTourSelection = () => setSelectedTours([]);

            const mapData = useMemo(() => {
                if (!selectedTours.length || !data.length) return {};
                const grouped = {};
                selectedTours.forEach(tour => {
                    grouped[tour] = data.filter(r => r.tour === tour).sort((a, b) => {
                        if (a.seq !== b.seq) return a.seq - b.seq;
                        return a.startTime - b.startTime;
                    });
                });
                return grouped;
            }, [data, selectedTours]);

            const selectedExpressDetails = useMemo(() => {
                if (!selectedTours.length || !data.length) return [];

                const timeVal = (t) => {
                    if (t && t.includes(':')) {
                        const parts = t.split(':').map(Number);
                        return parts[0] * 60 + parts[1];
                    }
                    return 9999;
                };

                return data.filter(r => {
                    if (!selectedTours.includes(r.tour) || !r.isExpress) return false;
                    const expCat = getExpressCategory(r.service, r.commit);
                    if (expCat && !expFilters[expCat]) return false;
                    return true;
                }).map(r => {
                    let state = 'Punktlich';
                    let commitTimeStr = r.commit || 'EOD';
                    const timeOnly = r.endStr ? r.endStr.split(' ')[1] : null;
                    if (timeOnly && commitTimeStr !== 'EOD' && !r.isForecast) {
                        const [h, m] = timeOnly.split(':').map(Number);
                        const [ch, cm] = commitTimeStr.split(':').map(Number);
                        if (h > ch || (h === ch && m > cm)) state = 'Verspaetet';
                    }
                    if (r.status.includes('DATA NOT AVAILABLE') || r.status.includes('VOID')) state = 'Ausnahme';
                    if (r.isForecast) state = 'Prognose';
                    const isBDR = r.status.includes('DRIVER RELEASE');
                    return { tour: r.tour, seq: r.seq, service: r.service, commit: commitTimeStr, actual: r.isForecast ? '--:--' : (timeOnly || '--:--'), state, location: r.city + ', ' + r.street, isBDR };
                }).sort((a, b) => timeVal(a.commit) - timeVal(b.commit) || a.tour.localeCompare(b.tour) || a.seq - b.seq);
            }, [data, selectedTours, expFilters]);

            const slaAndPickups = useMemo(() => {
                if (!data.length) return { violations: [], pickups: [] };
                const violations = [];
                const pickups = [];
                data.forEach(r => {
                    if (r.isForecast) return;
                    if (r.isExpress && r.commit && r.endTime && (r.status.includes('SIGNATURE') || r.status.includes('RELEASE') || r.status.includes('DELIVERED'))) {
                        let commitTime = new Date(r.endTime);
                        let hasCommit = false;
                        if (r.commit && r.commit !== 'EOD') {
                            const [ch, cm] = r.commit.split(':').map(Number);
                            commitTime.setHours(ch, cm, 0);
                            hasCommit = true;
                        }
                        if (hasCommit && r.endTime > commitTime.getTime()) {
                            const delayMins = Math.round((r.endTime - commitTime.getTime()) / 60000);
                            violations.push({ tour: r.tour, seq: r.seq, service: r.service, location: r.city + ', ' + r.street + ' ' + r.house, commitTimeStr: r.commit, actualTimeStr: r.endStr ? (r.endStr.split(' ')[1] || r.endStr) : '--:--', delayMins });
                        }
                    }
                    if (r.type && (r.type.includes('PICKUP') || r.type.includes('ODS'))) {
                        let readyTimeStr = "Kein Zeitfenster";
                        if (r.pickupReady && !r.pickupReady.includes('4712')) readyTimeStr = r.pickupReady.split(' ')[1] || r.pickupReady;
                        pickups.push({ tour: r.tour, seq: r.seq, type: r.type, location: r.city + ', ' + r.street + ' ' + r.house, status: r.status, actualTimeStr: r.startStr ? (r.startStr.split(' ')[1] || r.startStr) : '--:--', readyTimeStr });
                    }
                });
                return { violations: violations.sort((a, b) => b.delayMins - a.delayMins), pickups: pickups.sort((a, b) => a.tour.localeCompare(b.tour)) };
            }, [data]);

            const plzSummary = useMemo(() => {
                const counts = {};
                data.forEach(r => {
                    if (r.isExpress) {
                        let plz = r.postalCode || (r.city ? r.city.split(' ')[0] : '') || 'Unbekannt';
                        if (!counts[plz]) counts[plz] = { plz, early: 0, express1030: 0, nextDay: 0, bdr: 0, total: 0, location: r.city };
                        if (r.commit === '09:00') counts[plz].early++;
                        if (r.commit === '10:30') counts[plz].express1030++;
                        if (r.commit === '12:00' || r.commit === '14:00') counts[plz].nextDay++;
                        counts[plz].total++;
                        if (r.status.includes('DRIVER RELEASE')) counts[plz].bdr++;
                    }
                });
                return Object.values(counts).sort((a, b) => b.total - a.total);
            }, [data]);

            const allIdlesSummary = useMemo(() => {
                if (!data.length) return [];
                const idlesByTour = {};
                const groupedData = data.filter(r => !r.isForecast).reduce((acc, row) => {
                    if (!acc[row.tour]) acc[row.tour] = [];
                    acc[row.tour].push(row);
                    return acc;
                }, {});
                Object.keys(groupedData).forEach(tour => {
                    const stops = groupedData[tour].sort((a, b) => a.seq !== b.seq ? a.seq - b.seq : a.startTime - b.startTime);
                    const idles = [];
                    let totalNetIdleMinutes = 0;
                    for (let i = 1; i < stops.length; i++) {
                        const prev = stops[i - 1], curr = stops[i];
                        if (!prev.endTime || !curr.startTime) continue;
                        if (new Date(prev.endTime).getHours() < IDLE_START_HOUR) continue;
                        const diffMins = (curr.startTime - prev.endTime) / 60000;
                        const { distanceKm, driveTime } = calculateDistanceAndDriveTime(prev.lat, prev.lng, curr.lat, curr.lng);
                        const grossMins = Math.round(diffMins);
                        const netMins = Math.round(Math.max(0, diffMins - driveTime));
                        if (netMins >= idleThreshold) {
                            totalNetIdleMinutes += netMins;
                            idles.push({ tour, fromSeq: prev.seq, toSeq: curr.seq, fromTime: prev.endStr ? (prev.endStr.split(' ')[1] || prev.endStr) : '--:--', toTime: curr.startStr ? (curr.startStr.split(' ')[1] || curr.startStr) : '--:--', grossMins, driveTime, netMins, distanceKm: distanceKm.toFixed(1), location: curr.city + ', ' + curr.street + ' ' + curr.house });
                        }
                    }
                    if (idles.length > 0) idlesByTour[tour] = { idles, totalNetIdleMinutes };
                });
                return Object.entries(idlesByTour).map(([tour, info]) => ({ tour, ...info })).sort((a, b) => b.totalNetIdleMinutes - a.totalNetIdleMinutes);
            }, [data, idleThreshold]);

            const filteredIdles = useMemo(() => {
                if (idleTourFilter === 'Alle') return allIdlesSummary;
                return allIdlesSummary.filter(s => s.tour === idleTourFilter);
            }, [allIdlesSummary, idleTourFilter]);

            const tourPerformanceRaw = useMemo(() => {
                if (!data.length) return [];
                const grouped = data.reduce((acc, row) => { if (!acc[row.tour]) acc[row.tour] = []; acc[row.tour].push(row); return acc; }, {});
                return Object.entries(grouped).map(([tour, rows]) => {
                    const uniqueStops = new Map();
                    let b2bStops = 0, b2cStops = 0, successCount = 0, exceptionCount = 0, driverReleaseCount = 0;
                    let pickupStops = 0, deliveryStops = 0, pickupPkgs = 0, deliveryPkgs = 0;
                    let minStart = Infinity, maxEnd = 0;
                    rows.forEach(r => {
                        if (r.startTime && r.startTime < minStart) minStart = r.startTime;
                        if (r.endTime && r.endTime > maxEnd) maxEnd = r.endTime;
                        const status = (r.status || '').toUpperCase();
                        const isP = r.type && (r.type.includes('PICKUP') || r.type.includes('ODS'));
                        const successKeywords = ['AUTH RELEASE', 'DR RELEASE', 'SIG OBTAINED', 'FUTURE', 'LA CUST LOC', 'COMM INS REL', 'LEFT ARS TAG', 'MOVED', 'SDN', 'SIGNATURE', 'RELEASE', 'DELIVERED'];
                        const isSuccess = r.isForecast ? true : (successKeywords.some(key => status.includes(key)) || (isP && (status.includes('PICKED UP') || status.includes('COMPLETE') || status.includes('SUCCESS'))));

                        if (isSuccess) {
                            successCount++;
                        } else if (status.includes('DATA NOT AVAILABLE') || status.includes('VOID') || status.includes('EXCEPTION')) {
                            exceptionCount++;
                        }
                        if (status.includes('DRIVER RELEASE')) driverReleaseCount++;
                        if (isP) pickupPkgs++; else deliveryPkgs++;
                        const stopKey = r.isForecast ? normalizeAddressKey(r.street, r.postalCode, r.city) : r.seq;
                        if (!uniqueStops.has(stopKey)) {
                            uniqueStops.set(stopKey, { start: r.startTime, end: r.endTime, commercial: r.commercial, lat: r.lat, lng: r.lng });
                            if (r.commercial === 1) b2bStops++; else b2cStops++;
                            if (isP) pickupStops++; else deliveryStops++;
                        }
                    });
                    let totalStopDurationMs = 0, validDurationStops = 0;
                    uniqueStops.forEach(val => { if (val.start && val.end && val.end >= val.start) { totalStopDurationMs += (val.end - val.start); validDurationStops++; } });
                    const totalStops = uniqueStops.size, totalPackages = rows.length;
                    const dropDensity = totalStops > 0 ? parseFloat((totalPackages / totalStops).toFixed(1)) : 0;
                    const avgStopMins = validDurationStops > 0 ? parseFloat((totalStopDurationMs / validDurationStops / 60000).toFixed(1)) : 0;

                    let bruttoHours = 0, bruttoMins = 0;
                    if (minStart !== Infinity && maxEnd !== 0 && maxEnd > minStart) {
                        const diffMins = Math.round((maxEnd - minStart) / 60000);
                        bruttoHours = Math.floor(diffMins / 60);
                        bruttoMins = diffMins % 60;
                    }
                    const successRate = totalPackages > 0 ? Math.round((successCount / totalPackages) * 100) : 0;
                    const releaseRiskRate = totalPackages > 0 ? Math.round((driverReleaseCount / totalPackages) * 100) : 0;
                    return { tour, totalStops, totalPackages, dropDensity, b2bStops, b2cStops, pickupStops, deliveryStops, pickupPkgs, deliveryPkgs, bruttoHours, bruttoMins, successCount, exceptionCount, successRate, avgStopMins, releaseRiskRate };
                });
            }, [data]);

            const filteredTableRows = useMemo(() => {
                if (!data.length) return [];
                const q = tableSearch.trim().toLowerCase();
                return data.filter(r => {
                    if (tableCommitFilter !== 'Alle' && r.commit !== tableCommitFilter) return false;
                    if (!q) return true;
                    return (
                        String(r.postalCode || '').toLowerCase().includes(q) ||
                        String(r.city || '').toLowerCase().includes(q) ||
                        String(r.street || '').toLowerCase().includes(q) ||
                        String(r.recipient || '').toLowerCase().includes(q) ||
                        String(r.trackingNr || '').toLowerCase().includes(q) ||
                        String(r.tour || '').toLowerCase().includes(q)
                    );
                });
            }, [data, tableSearch, tableCommitFilter]);

            const handleExportGeoCache = async () => {
                const allCoords = await GeoDB.getAll();
                const blob = new Blob([JSON.stringify({ ok: true, engine: 'json', coords: allCoords, plz: DEFAULT_PLZ_COORDS }, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'geo_cache.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const sortedPerformanceSummary = useMemo(() => {
                let items = [...tourPerformanceRaw];
                if (sortConfig) {
                    items.sort((a, b) => {
                        let av = a[sortConfig.key], bv = b[sortConfig.key];
                        if (sortConfig.key === 'volume') { av = a.totalPackages; bv = b.totalPackages; }
                        else if (sortConfig.key === 'bruttoTime') { av = (a.bruttoHours * 60) + a.bruttoMins; bv = (b.bruttoHours * 60) + b.bruttoMins; }
                        else if (sortConfig.key === 'b2bRatio') { av = a.b2bStops / (a.b2bStops + a.b2cStops || 1); bv = b.b2bStops / (b.b2bStops + b.b2cStops || 1); }
                        if (av < bv) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (av > bv) return sortConfig.direction === 'asc' ? 1 : -1;
                        return a.tour < b.tour ? -1 : a.tour > b.tour ? 1 : 0;
                    });
                }
                return items;
            }, [tourPerformanceRaw, sortConfig]);

            const requestSort = (key) => {
                let direction = 'desc';
                if (sortConfig && sortConfig.key === key && sortConfig.direction === 'desc') direction = 'asc';
                setSortConfig({ key, direction });
            };

            const getSortIcon = (columnKey) => {
                if (sortConfig.key !== columnKey) return React.createElement('span', null, ' ↕');
                if (sortConfig.direction === 'asc') return React.createElement('span', { style: { color: '#FFB500' } }, ' ↑');
                return React.createElement('span', { style: { color: '#FFB500' } }, ' ↓');
            };

            const handleExportLeerzeiten = () => {
                let exportData = [];
                allIdlesSummary.forEach(sum => sum.idles.forEach(idle => exportData.push(idle)));
                exportCSV("Leerzeiten_Report", exportData.map(i => ({ "Tour": i.tour, "Start_Seq": i.fromSeq, "End_Seq": i.toSeq, "Von_Uhrzeit": i.fromTime, "Bis_Uhrzeit": i.toTime, "Brutto_Min": i.grossMins, "Fahrt_Min": i.driveTime, "Netto_Min": i.netMins, "Standort": i.location })));
            };

            const handleExportKPIs = () => {
                exportCSV("Tour_Performance_KPIs", sortedPerformanceSummary.map(i => ({ "Tour": i.tour, "Pakete": i.totalPackages, "Stopps": i.totalStops, "Zustell_Stopps": i.deliveryStops, "Abhol_Stopps": i.pickupStops, "Zustell_Pakete": i.deliveryPkgs, "Abhol_Pakete": i.pickupPkgs, "Dichte": i.dropDensity, "B2B": i.b2bStops, "B2C": i.b2cStops, "Brutto_h": i.bruttoHours, "Brutto_m": i.bruttoMins, "Erfolg_%": i.successRate, "Release_%": i.releaseRiskRate })));
            };

            useEffect(() => {
                if (activeTab !== 'map' || !mapInstance.current || !layerGroup.current) return;
                layerGroup.current.clearLayers();

                const toursKeys = Object.keys(mapData);
                if (toursKeys.length === 0) return;
                let allLatLngs = [];
                let activeHighlightLine = null;

                toursKeys.forEach((tour, index) => {
                    const stops = mapData[tour];
                    if (stops.length === 0) return;

                    const latLngs = [];
                    const lineColor = TOUR_LINE_COLORS[index % TOUR_LINE_COLORS.length];
                    const hasIdle = highlightIdle && highlightIdle.tour === tour;

                    stops.forEach((stop) => {
                        if (stop.lat === 0 && stop.lng === 0) return;

                        let isHighlighted = hasIdle && (stop.seq === highlightIdle.fromSeq || stop.seq === highlightIdle.toSeq);
                        if (hasIdle && !isHighlighted) return;

                        const filterIsBDR = stop.status && stop.status.includes('DRIVER RELEASE');
                        const expCat = getExpressCategory(stop.service, stop.commit);

                        if (!hasIdle && !showBDRFilter && filterIsBDR) return;
                        if (!hasIdle && expCat && !expFilters[expCat]) return;
                        latLngs.push([stop.lat, stop.lng]);
                        allLatLngs.push([stop.lat, stop.lng]);
                        const markerBgColor = getMarkerColor(stop.service, stop.commit);
                        const isPickup = stop.type && (stop.type.includes('PICKUP') || stop.type.includes('ODS'));
                        const isBDR = stop.status && stop.status.includes('DRIVER RELEASE');
                        const markerShape = isPickup ? '4px' : '50%';

                        const borderColor = isHighlighted ? '#ff0000' : lineColor;
                        const borderWidth = isHighlighted ? '4px' : '2px';
                        const label = isPickup ? ('P' + stop.seq) : stop.seq;

                        let bgStyle = "background-color: " + markerBgColor + "; color: white;";
                        if (isBDR) {
                            bgStyle = "background-color: white; color: " + markerBgColor + "; box-shadow: inset 0 0 0 3px " + markerBgColor + ";";
                        }

                        const icon = window.L.divIcon({
                            className: 'custom-div-icon',
                            html: '<div style="' + bgStyle + ' border-radius: ' + markerShape + '; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; border: ' + borderWidth + ' solid ' + borderColor + ';">' + label + '</div>',
                            iconSize: [24, 24], iconAnchor: [12, 12]
                        });

                        const actualTime = stop.startStr ? (stop.startStr.split(' ')[1] || stop.startStr) : (stop.isForecast ? 'Prognose (Keine Zeit)' : '--:--');
                        const bdrBadge = isBDR ? '<span style="background: #fef08a; color: #854d0e; padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: bold; float: right;">BDR</span>' : '';
                        const commercialStr = stop.commercial === 1 ? 'B2B (Gewerblich)' : 'B2C (Privat)';
                        const recipientLine = stop.recipient ? ('<b>Empfänger:</b> ' + stop.recipient + '<br/>') : '';

                        const popupContent = document.createElement('div');
                        popupContent.innerHTML = '<div style="font-family: sans-serif; min-width: 220px;"><div style="border-bottom: 2px solid ' + markerBgColor + '; padding-bottom: 6px; margin-bottom: 8px;"><strong style="color: #351C15; font-size: 14px;">Tour: ' + tour + ' | Seq: ' + stop.seq + '</strong>' + bdrBadge + '</div><div style="font-size: 12px; line-height: 1.6;">' + recipientLine + '<b>Ort:</b> ' + (stop.postalCode || '') + ' ' + stop.city + '<br/><b>Straße:</b> ' + stop.street + ' ' + stop.house + '<br/><b>Kunde:</b> ' + commercialStr + '<br/><b>Typ:</b> ' + (stop.type || 'Zustellung') + '<br/><b>Status:</b> ' + (stop.status || 'Offen') + '<br/><b>Service:</b> <span style="color: ' + markerBgColor + '; font-weight: bold;">' + (stop.service || 'STANDARD') + '</span></div><div style="background: #f8fafc; padding: 6px; border-radius: 4px; margin-top: 8px; font-size: 11px;"><div style="display: flex; justify-content: space-between;"><span>Soll-Zeit (Commit):</span> <b>' + (stop.commit || 'EOD') + '</b></div><div style="display: flex; justify-content: space-between;"><span>Ist-Zeit (Scanned):</span> <b>' + actualTime + '</b></div></div><hr style="margin: 10px 0; border: none; border-top: 1px solid #e2e8f0;"/><button id="btn-geocode-' + tour + '-' + stop.seq + '" style="width: 100%; padding: 6px; background-color: #FFB500; color: #351C15; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold;">GPS-Abweichung prüfen</button><div id="result-' + tour + '-' + stop.seq + '" style="margin-top: 5px; font-size: 11px; font-weight: bold; display: none;"></div></div>';
                        const marker = window.L.marker([stop.lat, stop.lng], { icon }).bindPopup(popupContent).addTo(layerGroup.current);
                        marker.on('popupopen', () => {
                            const btn = document.getElementById('btn-geocode-' + tour + '-' + stop.seq);
                            const resultDiv = document.getElementById('result-' + tour + '-' + stop.seq);
                            if (btn) {
                                btn.onclick = async () => {
                                    btn.innerHTML = 'Wird gepruft...'; btn.disabled = true;
                                    try {
                                        const query = encodeURIComponent(stop.street + ' ' + stop.house + ', ' + stop.city + ', Germany');
                                        const response = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + query + '&limit=1');
                                        const geoData = await response.json();
                                        if (geoData && geoData.length > 0) {
                                            const planLat = parseFloat(geoData[0].lat), planLng = parseFloat(geoData[0].lon);
                                            const R = 6371e3, phi1 = stop.lat * Math.PI / 180, phi2 = planLat * Math.PI / 180;
                                            const dphi = (planLat - stop.lat) * Math.PI / 180, dlambda = (planLng - stop.lng) * Math.PI / 180;
                                            const aa = Math.sin(dphi / 2) ** 2 + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dlambda / 2) ** 2;
                                            const distance = Math.round(R * 2 * Math.atan2(Math.sqrt(aa), Math.sqrt(1 - aa)));
                                            const planIcon = window.L.divIcon({ className: 'custom-plan-icon', html: '<div style="color: red; font-size: 20px;">X</div>', iconSize: [20, 20], iconAnchor: [10, 10] });
                                            window.L.marker([planLat, planLng], { icon: planIcon }).addTo(layerGroup.current);
                                            window.L.polyline([[stop.lat, stop.lng], [planLat, planLng]], { color: 'red', dashArray: '5, 5', weight: 2 }).addTo(layerGroup.current);
                                            btn.style.display = 'none'; resultDiv.style.display = 'block';
                                            resultDiv.style.color = distance > 150 ? '#dc2626' : '#16a34a';
                                            resultDiv.innerHTML = (distance > 150 ? 'Abweichung: ' : 'OK. Abweichung: ') + distance + ' Meter';
                                        } else { btn.innerHTML = 'Adresse nicht gefunden'; }
                                    } catch (error) { btn.innerHTML = 'Fehler'; btn.disabled = false; }
                                };
                            }
                        });
                    });
                    let highlightLine = null;
                    if (highlightIdle && highlightIdle.tour === tour) {
                        const s1 = stops.find(s => s.seq === highlightIdle.fromSeq);
                        const s2 = stops.find(s => s.seq === highlightIdle.toSeq);
                        if (s1 && s2 && s1.lat && s2.lat) {
                            highlightLine = [[s1.lat, s1.lng], [s2.lat, s2.lng]];
                            window.L.polygon(highlightLine, { color: 'red' }).addTo(layerGroup.current);
                            activeHighlightLine = highlightLine;
                        }
                    }
                    if (latLngs.length > 1 && !isForecastMode && !hasIdle) window.L.polyline(latLngs, { color: lineColor, weight: 4, opacity: 0.8 }).addTo(layerGroup.current);
                    if (highlightLine && !isForecastMode) {
                        window.L.polyline(highlightLine, { color: '#ff0000', dashArray: '10, 10', weight: 4, opacity: 1 }).addTo(layerGroup.current);
                    }

                    if (osrmRoutings[tour] && !isForecastMode && !hasIdle) {
                        if (osrmRoutings[tour].inGeom) {
                            window.L.polyline(osrmRoutings[tour].inGeom, { color: '#3b82f6', dashArray: '6, 8', weight: 3, opacity: 0.9 }).addTo(layerGroup.current);
                        }
                        if (osrmRoutings[tour].outGeom) {
                            window.L.polyline(osrmRoutings[tour].outGeom, { color: '#ec4899', dashArray: '6, 8', weight: 3, opacity: 0.9 }).addTo(layerGroup.current);
                        }
                    }
                });

                if (isForecastMode && window.L.heatLayer) {
                    const heatData = allLatLngs.map(ll => [ll[0], ll[1], 0.6]);
                    if (heatData.length > 0 && mapInstance.current) {
                        window.L.heatLayer(heatData, { radius: 35, blur: 25, maxZoom: 14 }).addTo(layerGroup.current);
                    }
                }

                if (allLatLngs.length > 0) {
                    if (activeHighlightLine) {
                        mapInstance.current.fitBounds(window.L.latLngBounds(activeHighlightLine), { padding: [100, 100], maxZoom: 16 });
                    } else {
                        mapInstance.current.fitBounds(window.L.latLngBounds(allLatLngs), { padding: [50, 50] });
                    }
                    setTimeout(() => { if (mapInstance.current) mapInstance.current.invalidateSize(); }, 100);
                }
            }, [mapData, activeTab, highlightIdle, showBDRFilter, expFilters, osrmRoutings]);

            return (
                <div
                    className="h-full flex flex-col p-4 relative"
                    onDragEnter={onDragEnter}
                    onDragOver={onDragOver}
                    onDragLeave={onDragLeave}
                    onDrop={onDrop}
                >
                    {isDragging && (
                        <div className="absolute inset-0 z-50 rounded-xl bg-blue-50 flex flex-col items-center justify-center m-4" style={{ backgroundColor: 'rgba(239, 246, 255, 0.95)', border: '4px dashed #3b82f6' }}>
                            <div className="pointer-events-none flex flex-col items-center justify-center">
                                <svg className="w-20 h-20 text-blue-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                <h2 className="text-3xl font-bold text-blue-700">Dateien hier ablegen</h2>
                                <p className="text-blue-500 mt-2 font-medium">CSV, TSV, TXT, XLSX, XLS</p>
                            </div>
                        </div>
                    )}
                    {/* 1. Header (Фиксированная высота) */}
                    <div className="shrink-0 bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                        <div>
                            <div className="flex items-center gap-3 flex-wrap">
                                <h1 className="text-xl lg:text-2xl font-bold text-[#351C15]">Disposition Analytics Dashboard</h1>
                                <span
                                    onClick={handleExportGeoCache}
                                    title="Klicken, um den aktuellen Geo-Cache als geo_cache.json herunterzuladen"
                                    className="cursor-pointer text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 transition-colors"
                                >
                                    🗄️ {dbEngine}: {Object.keys(plzCoordsCache).length} Einträge
                                </span>
                            </div>
                            <p className="text-sm text-gray-500 mt-1">Enterprise-Level: Routenüberschneidungen, SLAs und KPIs</p>
                        </div>
                        <div className="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto">
                            {data.length > 0 && !isForecastMode && (
                                <button onClick={fetchOsrmDepotRoutes} disabled={isFetchingOsrm} className={`flex items-center gap-2 px-4 py-2 rounded shadow-sm text-sm font-bold transition-colors w-full sm:w-auto ${isFetchingOsrm ? 'bg-gray-100 text-gray-400' : 'bg-[#e0e7ff] text-[#3730a3] hover:bg-[#c7d2fe] border border-[#a5b4fc]'}`}>
                                    {isFetchingOsrm ? 'Berechne OSRM Wege...' : '⛐ Alle Depotwege (OSRM) abrufen'}
                                </button>
                            )}
                            {data.length > 0 && (
                                <div className="flex items-center gap-2 bg-yellow-50 px-3 py-2 rounded border border-yellow-200 w-full sm:w-auto">
                                    <label className="text-sm font-bold text-yellow-800 whitespace-nowrap">Netto-Leerzeit &gt; (Min):</label>
                                    <input type="number" value={idleThreshold} onChange={(e) => setIdleThreshold(Number(e.target.value))} className="w-16 border-yellow-300 rounded shadow-sm p-1 text-sm bg-white font-bold text-center" min="5" max="240" />
                                </div>

                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                    {data.length > 0 && (

                            </button>
                        </div>

                    {/* 3. Основная контентная область (Flex-1 занимает остаток экрана) */}
                    <div className="flex-1 min-h-0 relative">
                        {data.length > 0 ? (
                            <>
                                {/* Tab: MAP (Карта и сайдбар занимают 100% высоты контейнера) */}
                                <div className={`h-full w-full ${activeTab === 'map' ? 'flex flex-col lg:flex-row gap-4' : 'hidden'}`}>
                                    {/* Левая панель со списками */}

                                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col flex-1 min-h-0">
                                            <div className="flex justify-between items-end mb-3 border-b pb-2 shrink-0">

                                            </div>
                                            <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 flex flex-col gap-1.5">
                                                {tours.map((t) => {
                                                    const isSelected = selectedTours.includes(t);

                                                    return (
                                                        <button key={t} onClick={() => toggleTourSelection(t)} className={"w-full text-left px-3 py-2 rounded text-sm font-medium border transition-colors flex justify-between items-center shrink-0 " + (isSelected ? 'bg-blue-50 border-blue-200 text-blue-900 shadow-sm' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50')}>
                                                            <div className="flex items-center gap-2">
                                                                <div className={"w-3 h-3 rounded-full border " + (isSelected ? 'border-transparent' : 'border-gray-300')} style={{ backgroundColor: lineColor }}></div>
                                                                {t}
                                                            </div>
                                                            {isSelected && <span className="text-blue-600">✓</span>}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                        {selectedExpressDetails.length > 0 && (

                                                <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 flex flex-col gap-2">
                                                    {selectedExpressDetails.map((pkg, idx) => {

                                                                <div className="flex justify-between text-[10px] bg-white/60 p-1 rounded">
                                                                    <span>Soll: <b>{pkg.commit}</b></span>
                                                                    <span>Ist: <b className={pkg.state === 'Verspaetet' ? 'text-red-600' : 'text-green-700'}>{pkg.actual}</b></span>

                                                            </div>

                                            </div>

                                                </button>
                                                <button onClick={() => setExpFilters(p => ({ ...p, 'OTHER': !p['OTHER'] }))} className={"px-2 py-1.5 rounded-lg font-bold text-[11px] border shadow-sm transition-colors flex items-center gap-1 " + (expFilters['OTHER'] ? "bg-pink-50 border-pink-300 text-pink-800" : "bg-white border-gray-200 text-gray-400 opacity-60")}>
                                                    <span className={"w-2 h-2 rounded-full " + (expFilters['OTHER'] ? 'bg-[#ec4899]' : 'bg-gray-400')}></span> Sonstige
                                                </button>
                                            </div>
                                            <button onClick={() => setShowExpressMapList(!showExpressMapList)} className="pointer-events-auto bg-white hover:bg-gray-50 border border-gray-200 text-[#351C15] px-3 py-2 rounded-lg font-bold shadow-sm flex items-center gap-2">
                                                <span className="w-2.5 h-2.5 rounded-full bg-[#351C15] inline-block"></span> Express-Liste {showExpressMapList ? 'verbergen' : 'einblenden'}
                                            </button>
                                            {showExpressMapList && selectedExpressDetails.length > 0 && (

                                                            <td className="px-4 py-3 text-center font-bold">{kpi.avgStopMins} Min.</td>
                                                            <td className="px-4 py-3 text-center border-l">
                                                                <div className={"font-bold mb-0.5 " + (kpi.successRate >= 95 ? 'text-green-600' : kpi.successRate < 80 ? 'text-red-600' : 'text-yellow-600')}>{kpi.successRate}% <span className="text-[10px] text-gray-400">({kpi.exceptionCount} Err)</span></div>
                                                                <div className={"font-bold text-xs " + (kpi.releaseRiskRate > 20 ? 'text-orange-600' : 'text-gray-500')}>{kpi.releaseRiskRate}% BDR</div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>

                                {/* Tab: GPS Kontrolle */}
                                <div className={`h-full flex flex-col ${activeTab === 'gps' ? 'block' : 'hidden'}`}>
                                    <div className="bg-white p-6 rounded-xl shadow border border-gray-200 flex flex-col h-full min-h-[500px]">
                                        <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-4 shrink-0 border-b pb-4 gap-4">
                                            <div>
                                                <h2 className="text-xl font-bold text-[#351C15]">GPS-Koordinaten Kontrolle</h2>
                                                <p className="text-sm text-gray-500 mt-1">Überprüfung der Zustellscans auf Abweichungen &gt; {gpsTolerance}m zur Plankoordinate.</p>
                                            </div>
                                            <div className="flex flex-wrap gap-4 items-end bg-gray-50 p-3 rounded-lg border border-gray-100 shadow-sm">
                                                <div className="flex flex-col">
                                                    <label className="text-xs font-bold text-gray-600 mb-1">Toleranz (Meter)</label>
                                                    <input type="number" value={gpsTolerance} onChange={e => setGpsTolerance(Number(e.target.value))} className="border border-gray-300 bg-white p-2 rounded w-24 text-sm font-bold text-center focus:ring-2 focus:ring-teal-500 outline-none" min="10" />
                                                </div>
                                                <div className="flex flex-col">
                                                    <label className="text-xs font-bold text-gray-600 mb-1">Tour auswählen</label>
                                                    <select value={gpsControlTour} onChange={e => setGpsControlTour(e.target.value)} className="border border-gray-300 bg-white p-2 rounded text-sm w-32 font-bold focus:ring-2 focus:ring-teal-500 outline-none">
                                                        <option value="">Tour...</option>
                                                        {tours.map(t => <option key={t} value={t}>{t}</option>)}
                                                    </select>
                                                </div>
                                                <button
                                                    onClick={() => runGpsCheck(false)}
                                                    disabled={!gpsControlTour || isCheckingGps}
                                                    className={`px-4 py-2 font-bold text-sm rounded transition-colors whitespace-nowrap ${!gpsControlTour || isCheckingGps ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-teal-600 text-white hover:bg-teal-700 shadow-md'}`}
                                                >
                                                    {isCheckingGps ? `Prüfe... ` : 'GPS-Kontrolle starten'}
                                                </button>

                                            </div>
                                        </div>

                                        <div className="flex-1 overflow-auto custom-scrollbar relative border rounded-lg bg-gray-50">
                                            {isCheckingGps && gpsDeviations.length === 0 && (
                                                <div className="absolute inset-0 flex items-center justify-center bg-white/80 z-20">
                                                    <div className="text-center w-full max-w-xs p-6 bg-white rounded-xl shadow-lg border border-teal-100">
                                                        <div className="text-teal-600 text-xl font-bold mb-4">{gpsCheckProgress}% Analysiert</div>
                                                        <div className="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
                                                            <div className="bg-teal-500 h-3 transition-all duration-300" style={{ width: gpsCheckProgress + '%' }}></div>
                                                        </div>
                                                        <div className="text-xs text-gray-400 mt-3 font-medium">Lade Geodaten von {gpsCheckMethod}...</div>
                                                    </div>
                                                </div>
                                            )}
                                            {!isCheckingGps && (!gpsDeviations || gpsDeviations.length === 0) && gpsControlTour && (
                                                <div className="h-full flex items-center justify-center p-8">
                                                    <div className="text-center bg-white p-8 rounded-xl shadow-sm border border-gray-200 w-full max-w-md">
                                                        <svg className="w-16 h-16 text-teal-400 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                        <h3 className="text-lg font-bold text-gray-800">Keine Auffälligkeiten</h3>
                                                        <p className="text-gray-500 mt-2 text-sm">Auf der Tour {gpsControlTour} gab es keine Zustellungen mit einer GPS-Abweichung von mehr als {gpsTolerance} Metern.</p>
                                                    </div>
                                                </div>
                                            )}
                                            {!gpsControlTour && !isCheckingGps && (
                                                <div className="h-full flex items-center justify-center text-gray-400 font-medium text-sm">
                                                    Bitte wählen Sie oben eine Tour aus und starten Sie die Analyse.
                                                </div>
                                            )}
                                            {gpsDeviations.length > 0 && (
                                                <table className="w-full text-left text-sm whitespace-nowrap bg-white">
                                                    <thead className="sticky top-0 bg-teal-50 shadow-sm z-10 text-xs text-teal-900 border-b border-teal-200">
                                                        <tr>
                                                            <th className="px-4 py-3 cursor-pointer hover:bg-teal-100">Seq</th>
                                                            <th className="px-4 py-3">Adresse / Ort</th>
                                                            <th className="px-4 py-3 text-center">Scan-Zeit</th>
                                                            <th className="px-4 py-3 text-center">Scan-Status</th>
                                                            <th className="px-4 py-3 text-right">Abweichung</th>
                                                            <th className="px-4 py-3 text-center">Karte</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-gray-100">
                                                        {gpsDeviations.map((dev, i) => (
                                                            <tr key={i} onClick={() => openGpsMap(dev)} className="hover:bg-blue-50 transition-colors cursor-pointer group">
                                                                <td className="px-4 py-3 font-bold text-gray-700 w-16">{dev.seq}</td>
                                                                <td className="px-4 py-3">
                                                                    <div className="font-bold text-gray-800 group-hover:text-blue-700">{dev.address.split(',')[0]}</div>
                                                                    <div className="text-xs text-gray-500">{dev.address.split(',')[1]}</div>
                                                                </td>
                                                                <td className="px-4 py-3 text-center font-medium text-gray-900">{dev.scanTime}</td>
                                                                <td className="px-4 py-3 text-center">
                                                                    <div className="text-xs font-bold text-gray-800 mb-0.5">{dev.status}</div>
                                                                    <div className="text-[10px] font-bold text-teal-700 bg-teal-50 inline-block px-1.5 py-0.5 rounded">{dev.service}</div>
                                                                </td>
                                                                <td className="px-4 py-3 text-right">
                                                                    <span className="inline-block px-2.5 py-1 rounded bg-red-50 text-red-700 font-bold border border-red-100 shadow-sm">
                                                                        {dev.distance.toLocaleString('de-DE')} m
                                                                    </span>
                                                                </td>
                                                                <td className="px-4 py-3 text-center">
                                                                    <div className="text-blue-500 group-hover:scale-125 transition-transform">
                                                                        <svg className="w-5 h-5 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            )}
                                        </div>
                                        {gpsDeviations.length > 0 && (
                                            <div className="mt-4 text-xs font-bold text-gray-500 flex justify-between items-center border-t pt-3">
                                                <span>Gefunden: <span className="text-red-600">{gpsDeviations.length}</span> Auffälligkeiten</span>
                                                <span>Toleranz-Limit: {gpsTolerance} m</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="h-full flex items-center justify-center">
                                <div className="bg-white p-12 rounded-xl border border-dashed border-gray-300 text-center w-full max-w-md">
                                    <h3 className="mt-2 text-sm font-semibold text-gray-900">Warten auf Daten</h3>
                                    <p className="mt-1 text-sm text-gray-500">Bitte laden Sie die Export-Datei (.csv / .tsv / .xlsx) hoch.</p>
                                </div>
                            </div>
                        )}
                    </div>
                    {/* Модальное окно просмотра GPS-нарушения */}
                    {selectedGpsDev && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 md:p-10 animate-in fade-in duration-200">
                            <div className="bg-white w-full h-full rounded-2xl shadow-2xl flex flex-col overflow-hidden relative border-4 border-white">
                                {/* Header */}
                                <div className="bg-slate-900 p-4 text-white flex justify-between items-center shrink-0">
                                    <div className="flex items-center gap-3">
                                        <div className="bg-blue-600 p-2 rounded-lg">
                                            <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-lg leading-tight">GPS-Kontrolle: #{selectedGpsDev.seq}</h3>
                                            <p className="text-xs text-slate-400 font-medium">{selectedGpsDev.address}</p>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => setSelectedGpsDev(null)}
                                        className="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-red-500 transition-colors text-white"
                                    >
                                        <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                                    </button>
                                </div>

                                {/* Content Area */}
                                <div className="flex-1 flex flex-col md:flex-row relative">
                                    {/* Iframe */}
                                    <div className="flex-1 bg-gray-100 relative min-h-[300px]">
                                        {googleApiKey ? (
                                            <iframe
                                                className="w-full h-full border-0"
                                                src={`https://www.google.com/maps/embed/v1/directions?key=${googleApiKey}&origin=${selectedGpsDev.planLat},${selectedGpsDev.planLng}&destination=${selectedGpsDev.lat},${selectedGpsDev.lng}&mode=driving&units=metric`}
                                                allowFullScreen
                                                loading="lazy"
                                            ></iframe>
                                        ) : (
                                            <div className="absolute inset-0 flex flex-col items-center justify-center p-10 text-center">
                                                <div className="bg-red-50 p-6 rounded-2xl border border-red-200 border-dashed">
                                                    <span className="text-4xl mb-4 block">🔑</span>
                                                    <h4 className="font-bold text-red-800 text-lg">Kein API-Key gefunden</h4>
                                                    <p className="text-red-600 text-sm mt-2 max-w-sm">
                                                        Bitte geben Sie Ihren Google Maps API-Key im Dashboard ein, чтобы использовать встроенные карты.
                                                    </p>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Sidebar Info */}
                                    <div className="w-full md:w-80 shrink-0 bg-gray-50 border-t md:border-t-0 md:border-l p-6 overflow-y-auto">
                                        <div className="space-y-6">
                                            <div>
                                                <div className="text-[10px] uppercase font-black text-gray-400 tracking-widest mb-1">Status</div>
                                                <div className="bg-white border p-3 rounded-xl shadow-sm">
                                                    <div className="font-bold text-gray-800">{selectedGpsDev.status}</div>
                                                    <div className="text-[11px] text-teal-600 font-bold mt-1">{selectedGpsDev.service}</div>
                                                </div>
                                            </div>

                                            <div>
                                                <div className="text-[10px] uppercase font-black text-gray-400 tracking-widest mb-1 text-red-500">Abweichung</div>
                                                <div className="bg-red-50 border border-red-100 p-3 rounded-xl shadow-sm flex items-baseline gap-2">
                                                    <span className="text-2xl font-black text-red-600">{selectedGpsDev.distance.toLocaleString('de-DE')}</span>
                                                    <span className="text-xs font-bold text-red-400">Meter</span>
                                                </div>
                                            </div>

                                            <div className="pt-4 border-t border-gray-200">
                                                <h4 className="text-xs font-bold text-gray-500 mb-3">Punkte Details:</h4>
                                                <div className="space-y-4">
                                                    <div className="flex gap-3">
                                                        <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 shrink-0 font-bold text-xs">P</div>
                                                        <div>
                                                            <div className="text-[10px] font-black text-gray-400 uppercase">Plan-Adresse</div>
                                                            <div className="text-xs font-bold text-gray-700 leading-tight">{selectedGpsDev.address}</div>
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-3">
                                                        <div className="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-600 shrink-0 font-bold text-xs">S</div>
                                                        <div>
                                                            <div className="text-[10px] font-black text-gray-400 uppercase">Scan-Ort</div>
                                                            <div className="text-xs font-bold text-gray-700 leading-tight">Gespielte Koordinate</div>
                                                            <div className="text-[10px] text-gray-400 mt-1">{selectedGpsDev.lat.toFixed(6)}, {selectedGpsDev.lng.toFixed(6)}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="pt-6">
                                                <a
                                                    href={`https://www.google.com/maps/dir/?api=1&origin=${selectedGpsDev.planLat},${selectedGpsDev.planLng}&destination=${selectedGpsDev.lat},${selectedGpsDev.lng}&travelmode=driving`}
                                                    target="_blank"
                                                    className="w-full bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 py-3 rounded-xl shadow-sm text-xs font-bold flex items-center justify-center gap-2 transition-all"
                                                >
                                                    ↗ In neuem Tab öffnen
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <UPSDispositionDashboard />
            </ErrorBoundary>
        );
    </script>
</body>

</html>
