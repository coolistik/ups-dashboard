            try {
                const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);

                let newCdSize = 0;
                let hasPivot = false;

                for (let i = 0; i < totalEntries; i++) {
                    if (dv.getUint32(ptr, true) !== 0x02014b50) return u8;
                    const fnLen = dv.getUint16(ptr + 28, true);
                    const extraLen = dv.getUint16(ptr + 30, true);
                    const commentLen = dv.getUint16(ptr + 32, true);
                    const localHdrOffset = dv.getUint32(ptr + 42, true);
                    const fn = td.decode(u8.subarray(ptr + 46, ptr + 46 + fnLen));
                    const cdEntryLen = 46 + fnLen + extraLen + commentLen;

                    const lExtraLen = dv.getUint16(localHdrOffset + 28, true);

                            cdStart: ptr,
                            cdLen: cdEntryLen,
                            localStart: localHdrOffset,
                            localLen: localTotalLen,
                            newLocalOffset: newLocalSize
                        });
                        newLocalSize += localTotalLen;
                        newCdSize += cdEntryLen;

        const DEPOT_LNG = 13.5112;
        const IDLE_START_HOUR = 9;

        const isExpress = (serviceType) => {
            const upper = (serviceType || '').toUpperCase();
            if (upper.includes('SAVER')) return false;
            return upper.includes('EXPRESS') || upper.includes('NEXT DAY') || upper.includes('EARLY AM') || upper.includes('PLUS') || upper.includes('10:30') || upper.includes('12:00');
        };

        const getExpressCategory = (serviceType, commit) => {
            const upper = (serviceType || '').toUpperCase();
            if (commit === '09:00' || upper.includes('EARLY') || upper.includes('PLUS') || upper.includes('09:00')) return '0900';
            if (commit === '10:30' || upper.includes('10:30')) return '1030';
            if (commit === '12:00' || commit === '14:00' || upper.includes('NEXT DAY') || upper.includes('12:00')) return '1200';
            if (upper.includes('EXPRESS') && !upper.includes('SAVER')) return 'OTHER';
            return null;
        };

        const getMarkerColor = (serviceType, commit) => {

            if (cat === '0900') return '#dc2626';

            if (cat === '1200') return '#f97316';
            if (cat === 'OTHER') return '#ec4899';

            const upper = (serviceType || '').toUpperCase();
            if (upper.includes('INTERNATIONAL')) return '#16a34a';
            if (upper.includes('SAVER')) return '#eab308';
            return '#3b82f6';
        };

        const getExpressColorClass = (commit, state) => {
            if (state === 'Verspaetet') return 'bg-red-50 border-red-300 text-red-700';
            if (state === 'Ausnahme') return 'bg-gray-50 border-gray-300 text-gray-500';
            if (commit === '09:00') return 'bg-red-50 border-red-200 border-l-4 border-l-[#dc2626] text-red-900';
            if (commit === '10:30') return 'bg-purple-50 border-purple-200 border-l-4 border-l-[#8b5cf6] text-purple-900';
            if (commit === '12:00' || commit === '14:00') return 'bg-orange-50 border-orange-200 border-l-4 border-l-[#f97316] text-orange-900';
            return 'bg-pink-50 border-pink-200 border-l-4 border-l-[#ec4899] text-pink-900';
        };

        const calculateDistanceAndDriveTime = (lat1, lon1, lat2, lon2) => {
            if (!lat1 || !lon1 || !lat2 || !lon2 || (lat1 === 0 && lon1 === 0) || (lat2 === 0 && lon2 === 0)) return { distanceKm: 0, driveTime: 0 };
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distanceKm = R * c;
            const driveTime = Math.ceil((distanceKm / 25) * 60);
            return { distanceKm, driveTime };
        };

        const exportCSV = (filename, rows) => {
            if (!rows || !rows.length) return;
            const separator = ';';
            const keys = Object.keys(rows[0]);
            const csvContent = "data:text/csv;charset=utf-8,\uFEFF" +
                keys.join(separator) + '\n' +
                rows.map(row => keys.map(k => {
                    let cell = row[k] === null || row[k] === undefined ? '' : row[k];
                    cell = cell.toString().replace(/"/g, '""');
                    if (cell.search(/("|,|;|\n)/g) >= 0) cell = '"' + cell + '"';
                    return cell;
                }).join(separator)).join('\n');
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", filename + ".csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        class ErrorBoundary extends React.Component {

                                </div>

                                <div className="bg-gray-50 text-left p-4 rounded-lg border border-gray-200 overflow-auto max-h-32 mb-6">

                }
                return this.props.children;
            }
        }

            const saveGoogleKeyToDb = async (newKey) => {

            const geocodeAddressSmart = async (addressStr, preferGoogle = true) => {
                const q = encodeURIComponent(addressStr);
                if (preferGoogle && googleApiKey) {
                    try {
                        const resG = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${q}&region=de&language=de&key=${googleApiKey}`);
                        if (resG.ok) {
                            const jG = await resG.json();
                            if (jG.status === 'OK' && jG.results && jG.results.length > 0) {
                                const r0 = jG.results[0];
                                return {
                                    lat: r0.geometry.location.lat,
                                    lng: r0.geometry.location.lng,
                                    locationType: r0.geometry.location_type || 'APPROXIMATE',
                                    formattedAddress: r0.formatted_address || addressStr,
                                    placeId: r0.place_id || '',
                                    partialMatch: !!r0.partial_match,
                                    provider: 'Google Maps'
                                };
                            }
                        }
                    } catch (_) {}
                }
                // Fallback: Photon (Komoot OSM)
                try {
                    const resP = await fetch(`https://photon.komoot.io/api/?q=${q}&limit=1`);
                    if (resP.ok) {
                        const jP = await resP.json();
                        if (jP && jP.features && jP.features.length > 0) {
                            const feat = jP.features[0];
                            const props = feat.properties || {};
                            return {
                                lat: feat.geometry.coordinates[1],
                                lng: feat.geometry.coordinates[0],
                                locationType: props.housenumber ? 'ROOFTOP' : 'GEOMETRIC_CENTER',
                                formattedAddress: [props.street, props.housenumber, props.postcode, props.city].filter(Boolean).join(' ') || addressStr,
                                placeId: '',
                                partialMatch: !props.housenumber,
                                provider: 'OpenStreetMap (Photon)'
                            };
                        }
                    }
                } catch (_) {}
                return null;
            };

            const runAddressValidation = async () => {
                if (!data.length || isValidatingAddresses) return;
                setIsValidatingAddresses(true);
                setValidationProgress(0);
                setAddressValidationResults([]);

                const uniqueStopsMap = new Map();
                data.forEach((d) => {
                    if (selectedTours.length > 0 && !selectedTours.includes(d.tour)) return;
                    const key = normalizeAddressKey(d.street, d.postalCode, d.city);
                    if (!uniqueStopsMap.has(key)) {
                        uniqueStopsMap.set(key, d);
                    }
                });

                const stopsList = Array.from(uniqueStopsMap.entries()).slice(0, 120);
                const checked = [];
                const updatedCacheEntries = {};

                for (let i = 0; i < stopsList.length; i++) {
                    const [normKey, stop] = stopsList[i];
                    const rawAddr = `${stop.street || ''} ${stop.house || ''}, ${stop.postalCode || ''} ${stop.city || ''}, Germany`.replace(/\s+/g, ' ').trim();
                    const geo = await geocodeAddressSmart(rawAddr, true);
                    if (geo) {
                        updatedCacheEntries[normKey] = { lat: geo.lat, lng: geo.lng, locationType: geo.locationType, formattedAddress: geo.formattedAddress };
                        const hasHouseNumInInput = /\d/.test(String(stop.street || '') + ' ' + String(stop.house || ''));
                        let quality = 'EXACT';
                        if (geo.locationType === 'APPROXIMATE' || geo.partialMatch) quality = 'WARNING';
                        if (!hasHouseNumInInput) quality = 'MISSING_HOUSENUM';

                        checked.push({
                            seq: stop.seq,
                            tour: stop.tour,
                            recipient: stop.recipient || '-',
                            commit: stop.commit || 'EOD',
                            inputAddress: `${stop.postalCode || ''} ${stop.city || ''}, ${stop.street || ''} ${stop.house || ''}`.trim(),
                            formattedAddress: geo.formattedAddress,
                            locationType: geo.locationType,
                            provider: geo.provider,
                            quality,
                            lat: geo.lat,
                            lng: geo.lng
                        });
                    }
                    setValidationProgress(Math.round(((i + 1) / stopsList.length) * 100));
                    await new Promise(r => setTimeout(r, googleApiKey ? 35 : 220));
                }

                if (Object.keys(updatedCacheEntries).length > 0) {
                    const nextCache = { ...plzCoordsCache, ...updatedCacheEntries };
                    setPlzCoordsCache(nextCache);
                    await GeoDB.setBulk(updatedCacheEntries);
                    // Применяем точные координаты сразу к текущим точкам
                    const updatedData = data.map(d => {
                        const nk = normalizeAddressKey(d.street, d.postalCode, d.city);
                        if (updatedCacheEntries[nk]) {
                            return {
                                ...d,
                                lat: updatedCacheEntries[nk].lat + (d.isForecast ? ((d.seq % 7) - 3) * 0.00005 : 0),
                                lng: updatedCacheEntries[nk].lng + (d.isForecast ? ((d.seq % 5) - 2) * 0.00005 : 0),
                                locationType: updatedCacheEntries[nk].locationType,
                                formattedAddress: updatedCacheEntries[nk].formattedAddress
                            };
                        }
                        return d;
                    });
                    setData(updatedData);
                    await GeoDB.saveReport('current_ups_data', updatedData, fileName, isForecastMode);
                }

                checked.sort((a, b) => (a.quality === 'EXACT' ? 1 : -1) - (b.quality === 'EXACT' ? 1 : -1));
                setAddressValidationResults(checked);
                setIsValidatingAddresses(false);
            };

            const calculateExpressSlaRoute = async (optimizeOrder = true) => {
                if (!data.length || isCalculatingSlaRoute) return;
                setIsCalculatingSlaRoute(true);

                const expressStops = data.filter(d => selectedTours.includes(d.tour) && d.isExpress && d.lat && d.lng);
                // Группируем по уникальным координатам/адресам, чтобы один стоп с 3 посылками считался одной остановкой
                const stopGroups = new Map();
                expressStops.forEach(d => {
                    const key = normalizeAddressKey(d.street, d.postalCode, d.city) || `${d.lat.toFixed(4)}_${d.lng.toFixed(4)}`;
                    if (!stopGroups.has(key)) {
                        stopGroups.set(key, {
                            ...d,
                            pkgCount: 1
                        });
                    } else {
                        const existing = stopGroups.get(key);
                        existing.pkgCount += 1;
                        // Берём самый ранний дедлайн на этом адресе
                        const order = { '09:00': 1, '10:30': 2, '12:00': 3, '14:00': 4, 'EOD': 5 };
                        if ((order[d.commit] || 9) < (order[existing.commit] || 9)) {
                            existing.commit = d.commit;
                            existing.service = d.service;
                        }
                    }
                });

                let stops = Array.from(stopGroups.values());
                if (stops.length === 0) {
                    setIsCalculatingSlaRoute(false);
                    return;
                }

                // Сортируем либо по приоритету временных окон + Nearest Neighbor (Оптимизация), либо по текущему Seq
                if (optimizeOrder) {
                    const commitWeight = (c) => c === '09:00' ? 1 : c === '10:30' ? 2 : c === '12:00' ? 3 : 4;
                    const unvisited = [...stops];
                    const ordered = [];
                    let curLat = DEPOT_LAT;
                    let curLng = DEPOT_LNG;

                    while (unvisited.length > 0) {
                        // Сначала ищем среди самого срочного доступного класса SLA
                        const minTier = Math.min(...unvisited.map(u => commitWeight(u.commit)));
                        const candidates = unvisited.filter(u => commitWeight(u.commit) === minTier);
                        let bestIdx = 0;
                        let bestDist = Infinity;
                        candidates.forEach((cand) => {
                            const { distanceKm } = calculateDistanceAndDriveTime(curLat, curLng, cand.lat, cand.lng);
                            if (distanceKm < bestDist) {
                                bestDist = distanceKm;
                                bestIdx = unvisited.indexOf(cand);
                            }
                        });
                        const chosen = unvisited.splice(bestIdx, 1)[0];
                        ordered.push(chosen);
                        curLat = chosen.lat;
                        curLng = chosen.lng;
                    }
                    stops = ordered;
                } else {
                    stops.sort((a, b) => a.seq - b.seq);
                }

                const [startH, startM] = (routeStartTime || '08:00').split(':').map(Number);
                let currentMins = (startH || 8) * 60 + (startM || 0);
                let prevLat = DEPOT_LAT;
                let prevLng = DEPOT_LNG;
                let totalKm = 0;
                let riskCount = 0;

                const schedule = stops.map((st, idx) => {
                    const { distanceKm, driveTime } = calculateDistanceAndDriveTime(prevLat, prevLng, st.lat, st.lng);
                    totalKm += distanceKm;
                    currentMins += driveTime;
                    const arrH = Math.floor(currentMins / 60);
                    const arrM = currentMins % 60;
                    const etaStr = `${String(arrH).padStart(2, '0')}:${String(arrM).padStart(2, '0')}`;

                    let commitMins = 23 * 60 + 59;
                    if (st.commit && st.commit.includes(':')) {
                        const [ch, cm] = st.commit.split(':').map(Number);
                        commitMins = ch * 60 + cm;
                    }
                    const bufferMins = commitMins - currentMins;
                    const isLateRisk = bufferMins < 0;
                    if (isLateRisk) riskCount++;

                    currentMins += Number(serviceStopDuration) || 3;
                    prevLat = st.lat;
                    prevLng = st.lng;

                    return {
                        orderNum: idx + 1,
                        origSeq: st.seq,
                        tour: st.tour,
                        recipient: st.recipient || '-',
                        address: `${st.postalCode || ''} ${st.city || ''}, ${st.street || ''}`.trim(),
                        commit: st.commit || 'EOD',
                        pkgCount: st.pkgCount,
                        distanceKm: distanceKm.toFixed(1),
                        driveTime,
                        etaStr,
                        bufferMins,
                        isLateRisk,
                        lat: st.lat,
                        lng: st.lng
                    };
                });

                // Формируем прямую ссылку на Google Maps Navigation (до 10 точек в одном навигационном пакете)
                const navStops = schedule.slice(0, 10);
                const waypointsStr = navStops.slice(0, -1).map(s => `${s.lat},${s.lng}`).join('|');
                const lastStop = navStops[navStops.length - 1];
                const googleNavUrl = lastStop
                    ? `https://www.google.com/maps/dir/?api=1&origin=${DEPOT_LAT},${DEPOT_LNG}&destination=${lastStop.lat},${lastStop.lng}${waypointsStr ? '&waypoints=' + encodeURIComponent(waypointsStr) : ''}&travelmode=driving`
                    : '';

                setSlaRouteAnalysis({
                    optimized: optimizeOrder,
                    totalStops: schedule.length,
                    totalKm: totalKm.toFixed(1),
                    riskCount,
                    finishTime: schedule.length > 0 ? schedule[schedule.length - 1].etaStr : routeStartTime,
                    googleNavUrl,
                    schedule
                });
                setIsCalculatingSlaRoute(false);
            };

            const runGpsCheck = async (useGoogle = false) => {
                setGpsCheckMethod(useGoogle ? 'Google Maps Geocoding API' : 'Photon/OSM API');
                if (!gpsControlTour || isCheckingGps) return;
                if (useGoogle && !googleApiKey) {
                    setShowApiModal(true);
                    return;
                }
                if (useGoogle) {
                    await saveGoogleKeyToDb(googleApiKey);
                }

                setIsCheckingGps(true);
                setGpsDeviations([]);
                setGpsCheckProgress(0);

                const stops = data.filter(d => d.tour === gpsControlTour && !d.isForecast && d.lat !== 0 && d.lng !== 0 && d.type === 'DELIVERY');
                const results = [];
                const newGeoCache = {};

                for (let i = 0; i < stops.length; i++) {
                    const stop = stops[i];
                    const addrStr = `${stop.street || ''} ${stop.house || ''}, ${stop.postalCode || ''} ${stop.city || ''}, Germany`;
                    try {
                        let planLat = null;
                        let planLng = null;

                        const geoRes = await geocodeAddressSmart(addrStr, useGoogle);
                        if (geoRes) {
                            planLat = geoRes.lat;
                            planLng = geoRes.lng;
                            const nk = normalizeAddressKey(stop.street, stop.postalCode, stop.city);
                            newGeoCache[nk] = { lat: planLat, lng: planLng, locationType: geoRes.locationType };
                        }

                        if (planLat && planLng) {
                            const R = 6371e3;
                            const phi1 = stop.lat * Math.PI / 180;
                            const phi2 = planLat * Math.PI / 180;
                            const dphi = (planLat - stop.lat) * Math.PI / 180;
                            const dlambda = (planLng - stop.lng) * Math.PI / 180;
                            const aa = Math.sin(dphi / 2) ** 2 + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dlambda / 2) ** 2;
                            const distance = Math.round(R * 2 * Math.atan2(Math.sqrt(aa), Math.sqrt(1 - aa)));

                            if (distance >= gpsTolerance) {
                                results.push({
                                    seq: stop.seq,
                                    address: stop.postalCode + ' ' + stop.city + ', ' + stop.street + ' ' + stop.house,
                                    scanTime: stop.startStr ? (stop.startStr.split(' ')[1] || stop.startStr) : '--:--',
                                    status: stop.status,
                                    service: stop.service,
                                    distance: distance,
                                    lat: stop.lat, lng: stop.lng,
                                    planLat, planLng
                                });
                            }
                        }
                    } catch (e) { console.error(e); }
                    setGpsCheckProgress(Math.round(((i + 1) / stops.length) * 100));

                    if (useGoogle) {
                        await new Promise(r => setTimeout(r, 25)); // Google is fast
                    } else {
                        await new Promise(r => setTimeout(r, 300)); // Photon rate limit
                    }
                }
                if (Object.keys(newGeoCache).length > 0) {
                    await GeoDB.setBulk(newGeoCache);
                    setPlzCoordsCache(prev => ({ ...prev, ...newGeoCache }));
                }
                results.sort((a, b) => b.distance - a.distance);
                setGpsDeviations(results);
                setIsCheckingGps(false);
            };

            const openGpsMap = (dev) => {
                setSelectedGpsDev(dev);
            };

            const fetchOsrmTourRoads = async (forceRefresh = false) => {
                if (!data.length || isFetchingOsrm) return;
                setIsFetchingOsrm(true);

                const grouped = data.reduce((acc, row) => {
                    if (row.tour === 'Prognosen (Vorladung)') return acc;
                    if (!acc[row.tour]) acc[row.tour] = [];
                    acc[row.tour].push(row);
                    return acc;
                }, {});

                const newRoutings = forceRefresh ? {} : { ...osrmRoutings };
                const tourList = Object.keys(grouped);

                for (const tour of tourList) {
                    const rows = grouped[tour] || [];
                    // Deduplicate stops by normalized address or seq, preserving stop sequence order
                    const seenKeys = new Set();
                    const orderedStops = [];
                    rows.slice().sort((a, b) => (a.seq || 0) - (b.seq || 0)).forEach(r => {
                        if (!r.lat || !r.lng || r.lat === 0) return;
                        const k = normalizeAddressKey(r.street, r.postalCode, r.city) || `${r.lat.toFixed(4)}_${r.lng.toFixed(4)}`;
                        if (!seenKeys.has(k)) {
                            seenKeys.add(k);
                            orderedStops.push({ seq: r.seq, lat: r.lat, lng: r.lng, key: k });
                        }
                    });

                    if (orderedStops.length === 0) continue;

                    // Signature of current stop order so we only re-fetch when stops or sequence changed
                    const sig = orderedStops.map(s => `${s.lat.toFixed(4)},${s.lng.toFixed(4)}`).join(';');
                    if (!forceRefresh && newRoutings[tour] && newRoutings[tour].sig === sig && newRoutings[tour].fullRoadGeom) {
                        continue;
                    }

                    try {
                        // Build full coordinate chain: Depot -> Stop 1 -> Stop 2 -> ... -> Stop N (cap at 65 waypoints for OSRM URL length)
                        const waypoints = [{ lat: DEPOT_LAT, lng: DEPOT_LNG }, ...orderedStops.slice(0, 65)];
                        const coordString = waypoints.map(w => `${w.lng.toFixed(5)},${w.lat.toFixed(5)}`).join(';');
                        const resRoad = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson&steps=false`);
                        if (resRoad.ok) {
                            const dataRoad = await resRoad.json();
                            if (dataRoad.routes && dataRoad.routes[0]) {
                                const routeObj = dataRoad.routes[0];
                                const fullRoadGeom = routeObj.geometry.coordinates.map(c => [c[1], c[0]]);
                                const totalRoadKm = (routeObj.distance / 1000).toFixed(1);
                                const totalRoadMins = Math.ceil(routeObj.duration / 60);
                                const legData = (routeObj.legs || []).map(l => ({
                                    distanceKm: l.distance / 1000,
                                    driveTime: Math.max(1, Math.ceil(l.duration / 60))
                                }));
                                newRoutings[tour] = {
                                    sig,
                                    fullRoadGeom,
                                    totalRoadKm,
                                    totalRoadMins,
                                    legData
                                };
                                setOsrmRoutings({ ...newRoutings });
                            }
                        }
                        await new Promise(r => setTimeout(r, 120));
                    } catch (e) {
                        console.error("OSRM Tour Road Error", tour, e);
                    }
                }

                setOsrmRoutings({ ...newRoutings });
                setIsFetchingOsrm(false);
            };

            const fetchOsrmDepotRoutes = () => fetchOsrmTourRoads(true);

            // Auto-fetch real road geometries whenever distributed tours exist
            useEffect(() => {
                const assignedTours = tours.filter(t => t !== 'Prognosen (Vorladung)');
                if (assignedTours.length > 0 && data.length > 0) {
                    const timer = setTimeout(() => {
                        fetchOsrmTourRoads(false);
                    }, 250);
                    return () => clearTimeout(timer);
                }
            }, [tours, data]);

            const clearData = async () => {
                if (confirm('Möchten Sie alle Daten wirklich zurücksetzen? (Löscht auch die Speicherung im Browser)')) {
                    setData([]);
                    setTours([]);
                    setSelectedTours([]);
                    setGpsDeviations([]);
                    setFileName('');
                    await GeoDB.clearAllReports();
                    window.location.reload();
                }
            };

            const mapRef = useRef(null);
            const mapInstance = useRef(null);
            const tileLayerRef = useRef(null);
            const layerGroup = useRef(null);

            const getTileConfig = (type) => {
                switch (type) {
                    case 'g_road':
                        return {
                            url: 'https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=de',
                            attribution: '© Google Maps',
                            maxZoom: 20
                        };
                    case 'g_traffic':
                        return {
                            url: 'https://mt1.google.com/vt/lyrs=m,traffic&x={x}&y={y}&z={z}&hl=de',
                            attribution: '© Google Maps Live Traffic',
                            maxZoom: 20
                        };
                    case 'g_hybrid':
                        return {
                            url: 'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}&hl=de',
                            attribution: '© Google Maps Satellite Hybrid',
                            maxZoom: 20
                        };
                    case 'g_terrain':
                        return {
                            url: 'https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}&hl=de',
                            attribution: '© Google Maps Terrain',
                            maxZoom: 20
                        };
                    case 'osm':
                    default:
                        return {
                            url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                            attribution: '© OpenStreetMap',
                            maxZoom: 19
                        };
                }
            };

            const handleSwitchMapTile = (newType) => {
                setMapTileType(newType);
                safeStorage.setItem('ups_map_tile_type', newType);
                GeoDB.saveSettings({ map_tile_type: newType });
                if (mapInstance.current) {
                    if (tileLayerRef.current) {
                        mapInstance.current.removeLayer(tileLayerRef.current);
                    }
                    const cfg = getTileConfig(newType);
                    tileLayerRef.current = L.tileLayer(cfg.url, {
                        attribution: cfg.attribution,
                        maxZoom: cfg.maxZoom
                    }).addTo(mapInstance.current);
                }
            };

            useEffect(() => {
                if (activeTab === 'map' && mapRef.current && !mapInstance.current) {
                    mapInstance.current = L.map(mapRef.current).setView([51.0504, 13.7373], 11);
                    const cfg = getTileConfig(mapTileType);
                    tileLayerRef.current = L.tileLayer(cfg.url, {
                        attribution: cfg.attribution,
                        maxZoom: cfg.maxZoom,
                    }).addTo(mapInstance.current);
                    layerGroup.current = L.layerGroup().addTo(mapInstance.current);
                    setTimeout(() => { if (mapInstance.current) mapInstance.current.invalidateSize(); }, 100);
                }
            }, [activeTab, data.length]);

            const onDragEnter = (e) => {
                e.preventDefault();
                e.stopPropagation();
                dragCounter.current += 1;
                if (dragCounter.current === 1) setIsDragging(true);
            };

            const onDragOver = (e) => {
                e.preventDefault();
                e.stopPropagation();
            };

            const onDragLeave = (e) => {
                e.preventDefault();
                e.stopPropagation();
                dragCounter.current -= 1;
                if (dragCounter.current === 0) setIsDragging(false);
            };

            const onDrop = async (e) => {
                e.preventDefault();
                e.stopPropagation();
                dragCounter.current = 0;
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    await processFiles(Array.from(e.dataTransfer.files));
                }
            };

            const handleFileUpload = async (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    await processFiles(Array.from(e.target.files));
                }
                e.target.value = null;
            };

            const processFiles = async (files) => {
                if (files.length === 0) { setFileName(''); return; }
                const currentUploadName = files.length > 1 ? `${files.length} Dateien ausgewählt` : files[0].name;
                setFileName(currentUploadName);
                setLoadingStatus('Lese Dateien...');
                setLoadingProgress(15);
                await new Promise(resolve => setTimeout(resolve, 20));

                // Очищаем предыдущий отчёт при новой загрузке, чтобы строки не дублировались
                let combinedData = [];
                let hasForecast = false;
                let coordsDict = { ...PRELOADED_GEO_CACHE, ...plzCoordsCache };

                for (let i = 0; i < files.length; i++) {
                    let file = files[i];
                    setLoadingStatus(`Verarbeite ${file.name}...`);
                    await new Promise(resolve => setTimeout(resolve, 10));
                    if (file.name.toLowerCase().endsWith('.xlsx') || file.name.toLowerCase().endsWith('.xls')) {
                        hasForecast = true;
                        const rawArr = new Uint8Array(await file.arrayBuffer());
                        // Отсекаем 25.7 МБ скрытого кэша сводной таблицы (xl/pivotCache/) за ~5 мс перед чтением SheetJS
                        const cleanArr = stripPivotCacheFromXlsx(rawArr);
                        let workbook;
                        try {
                            workbook = window.XLSX.read(cleanArr, { type: 'array', cellFormula: false, cellHTML: false, cellStyles: false });
                        } catch (_) {
                            workbook = window.XLSX.read(rawArr, { type: 'array' });
                        }
                        let tourName = 'Prognosen (Vorladung)';
                        let rowsBeforeFile = combinedData.length;

                        workbook.SheetNames.forEach(sheetName => {
                            // Пропускаем сводный лист Summary, если в книге есть детальные листы
                            if (sheetName.toLowerCase() === 'summary' && workbook.SheetNames.length > 1) return;
                            let sheetObj = workbook.Sheets[sheetName];
                            let raws = window.XLSX.utils.sheet_to_json(sheetObj, { header: 1 });
                            let headerRowIdx = raws.findIndex(r => Array.isArray(r) && (r.includes('Cnsee Postal') || r.includes('Tracking Nr') || r.includes('PLZ')));
                            if (headerRowIdx === -1) headerRowIdx = 0;
                            const rows = window.XLSX.utils.sheet_to_json(sheetObj, { range: headerRowIdx, defval: "" });
                            rows.forEach((row, rowIdx) => {
                                let plzStr = row['PLZ'] || row['Zip'] || row['Postal'] || row['Postal Code'] || row['Empfänger PLZ'] || row['Cnsee Postal'] || '';
                                let plzMatch = String(plzStr).match(/\b01\d{3}\b/);
                                let adr = extractBestStreet(row);
                                if (!plzMatch && adr.match(/\b01\d{3}\b/)) plzMatch = adr.match(/\b01\d{3}\b/);
                                let plz = plzMatch ? plzMatch[0] : String(plzStr).trim();

                                let service = row['Service'] || row['Commit'] || row['Billing Service'] || row['Service Level'] || '';
                                let sTime = String(row['Sched Delv Time'] || '');
                                let commitStr = 'EOD';
                                if (sTime.includes('09')) { commitStr = '09:00'; service = 'EXPRESS PLUS'; }
                                else if (sTime.includes('10')) { commitStr = '10:30'; service = 'EXPRESS 10:30'; }
                                else if (sTime.includes('12')) { commitStr = '12:00'; service = 'EXPRESS 12:00'; }
                                else if (sTime.includes('14')) { commitStr = '14:00'; service = 'EXPRESS 14:00'; }
                                else if (sTime.includes('23')) { commitStr = 'EOD'; service = 'SAVER'; }
                                else if (sTime) commitStr = sTime.replace(/\./g, ':').slice(0, 5);
                                if (!service) service = 'EXPRESS 10:30';

                                if (plz) {
                                    const recipient = String(row['Cnsee Na'] || row['Empfänger'] || '').trim();
                                    const trackingNr = String(row['Tracking Nr'] || row['Shipment Nr'] || '').trim();
                                    combinedData.push({
                                        tour: tourName,
                                        seq: (combinedData.length - rowsBeforeFile) + 1,
                                        startStr: '',
                                        endStr: '',
                                        startTime: 0,
                                        endTime: 0,
                                        lat: 0,
                                        lng: 0,
                                        city: String(row['City'] || row['Ort'] || row['Stadt'] || row['Cnsee City'] || row['Ship Dest Facility'] || '').trim(),
                                        postalCode: String(plz),
                                        street: adr,
                                        recipient,
                                        trackingNr,
                                        house: '',
                                        service: service,
                                        isExpress: isExpress(service),
                                        status: file.name.toUpperCase().includes('BDR') ? 'DRIVER RELEASE' : '',
                                        type: 'DELIVERY',
                                        commercial: recipient ? 1 : 0,
                                        commit: commitStr,
                                        isForecast: true
                                    });
                                }
                            });
                        });

                        if (combinedData.length === rowsBeforeFile) {
                            alert(`Hinweis zu "${file.name}": Es wurden keine Detail-Sendungen mit Postleitzahl (PLZ / Cnsee Postal) gefunden. Bitte stellen Sie sicher, dass das Detail-Tabellenblatt (z.B. Detail1) in der Excel-Datei enthalten ist.`);
                        }
                    } else {
                        const text = await file.text();
                        const parsedData = parseTSV(text);
                        const processed = parsedData.map((row) => {
                            const srv = row['Billing- Service Commit Type Desc'] || '';
                            const headers = Object.keys(row);
                            const colSValue = row[headers[18]] || ''; // 19th column (S)
                            const code = colSValue.length >= 10 ? colSValue.substring(8, 10) : '';

                            let commitStr = 'EOD';
                            if (code === '54' || srv.includes('PLUS') || srv.includes('EARLY') || srv.includes('09:00')) {
                                commitStr = '09:00';
                            } else if (['QD', 'QE', 'QH'].includes(code) || srv.includes('12:00') || srv.includes('NEXT DAY')) {
                                commitStr = '12:00';
                            } else if (['85', '77', '69', '66'].includes(code) || srv.includes('10:30') || (srv.includes('EXPRESS') && !srv.includes('SAVER'))) {
                                commitStr = '10:30';
                            }

                            return {
                                tour: row['Dispatch Loop Position Num'],
                                seq: parseInt(row['Stop Actual Sequence Num'], 10) || 0,
                                startStr: row['Stop Start Time HHMMSS'],
                                endStr: row['Stop Complete Time HHMMSS'],
                                startTime: new Date(row['Stop Start Time HHMMSS']).getTime(),
                                endTime: new Date(row['Stop Complete Time HHMMSS']).getTime(),
                                lat: parseFloat(row['Trigger 3 GPS Latitude']),
                                lng: parseFloat(row['Trigger 3 GPS Longitude']),
                                city: row['City Name'],
                                postalCode: row['Postal Code'] || row['Consignee Postal Code'] || '',
                                street: row['Street Name'],
                                house: row['Street Num'],
                                service: srv,
                                commit: commitStr,
                                isExpress: isExpress(srv) || commitStr !== 'EOD',
                                status: row['Deliv Stop Classification Desc'] || '',
                                type: row['Stop Type Desc'] || '',
                                pickupAccept: row['ODS Pickup Accept Time HHMMSS'],
                                pickupReady: row['ODS Pickup Ready Time HHMMSS'],
                                commercial: parseInt(row['Stop Commercial Identity Ind'], 10) || 0,
                                isForecast: false
                            };
                        }).filter(r => !isNaN(r.lat) && !isNaN(r.lng) && r.tour);
                        combinedData = combinedData.concat(processed);
                    }
                    setLoadingProgress(20 + Math.round(((i + 1) / files.length) * 40));
                }

                setIsForecastMode(hasForecast);

                // Функция привязки координат из БД (SQLite / IndexedDB / DEFAULT_PLZ_COORDS)
                const applyCoordsToForecast = (rowsList, dict) => {
                    return rowsList.map(d => {
                        if (d.isForecast) {
                            const normKey = normalizeAddressKey(d.street, d.postalCode, d.city);
                            const legacyKey = `${(d.street || '').replace(/\*/g, 's')} ${d.postalCode || ''} ${d.city || ''}`.trim();
                            const hit = dict[normKey] || dict[legacyKey];
                            if (hit && hit.lat && hit.lng) {
                                d.lat = hit.lat + ((d.seq % 7) - 3) * 0.00008;
                                d.lng = hit.lng + ((d.seq % 5) - 2) * 0.00008;
                            } else {
                                const defaultFallback = DEFAULT_PLZ_COORDS[d.postalCode] || DEFAULT_PLZ_COORDS['01067'] || { lat: 51.0507, lng: 13.7373 };
                                const seqIndex = d.seq || 1;
                                const radius = 0.004 + (Math.sqrt(seqIndex) % 18) * 0.0009;
                                const angle = seqIndex * 2.39996;
                                d.lat = defaultFallback.lat + radius * Math.cos(angle);
                                d.lng = defaultFallback.lng + radius * Math.sin(angle) * 1.4;
                            }
                        }
                        return d;
                    }).filter(d => (!d.isForecast) || (d.isForecast && !!d.lat));
                };

                if (hasForecast) {
                    combinedData = applyCoordsToForecast(combinedData, coordsDict);
                }

                // Мгновенно отображаем данные в дашборде (не блокируя интерфейс сетевым геокодингом!)
                combinedData = combinedData.map((r, idx) => ({ ...r, _uid: r._uid || `pkg_${idx}_${r.trackingNr || r.seq}` }));
                const uniqueTours = [...new Set(combinedData.map(r => r.tour))].sort();
                setData(combinedData);
                setTours(uniqueTours);
                setSelectedTours(uniqueTours);
                setIdleTourFilter('Alle');
                setLoadingStatus('Fertig!');
                setLoadingProgress(100);

                try {
                    await GeoDB.saveReport('current_ups_data', combinedData, currentUploadName, hasForecast);
                } catch (err) {
                    console.error('Failed to save persistence data', err);
                }

                // Если в файле прогноза есть новые адреса, которых ещё нет в БД ups_cache.db, догеокодируем их в фоне
                if (hasForecast) {
                    const missingAddrs = [...new Set(combinedData.filter(d => d.isForecast).map(d => {
                        const normKey = normalizeAddressKey(d.street, d.postalCode, d.city);
                        const legacyKey = `${(d.street || '').replace(/\*/g, 's')} ${d.postalCode || ''} ${d.city || ''}`.trim();
                        if (coordsDict[normKey] || coordsDict[legacyKey]) return null;
                        return normKey;
                    }).filter(Boolean))];

                    if (missingAddrs.length > 0) {
                        const maxGCalls = Math.min(missingAddrs.length, 300);
                        const CHUNK_SIZE = googleApiKey ? 10 : 6;
                        let addrsProcessed = 0;
                        const newGeoEntries = {};

                        for (let i = 0; i < maxGCalls; i += CHUNK_SIZE) {
                            const chunk = missingAddrs.slice(i, Math.min(i + CHUNK_SIZE, maxGCalls));
                            await Promise.all(chunk.map(async (addrKey) => {
                                try {
                                    const geo = await geocodeAddressSmart(addrKey + ', Germany', true);
                                    if (geo && geo.lat && geo.lng) {
                                        const val = {
                                            lat: geo.lat,
                                            lng: geo.lng,
                                            locationType: geo.locationType,
                                            formattedAddress: geo.formattedAddress
                                        };
                                        coordsDict[addrKey] = val;
                                        newGeoEntries[addrKey] = val;
                                    }
                                } catch (_) {}
                                addrsProcessed++;
                            }));

                            setLoadingStatus(`Hintergrund-Geocoding (${googleApiKey ? 'Google Maps' : 'OSM'})... ${addrsProcessed}/${maxGCalls}`);
                            setLoadingProgress(Math.round((addrsProcessed / maxGCalls) * 100));

                            if (Object.keys(newGeoEntries).length > 0) {
                                await GeoDB.setBulk({ ...newGeoEntries });
                                Object.keys(newGeoEntries).forEach(k => delete newGeoEntries[k]);
                            }
                            if (i + CHUNK_SIZE < maxGCalls) {
                                await new Promise(r => setTimeout(r, googleApiKey ? 80 : 350));
                            }
                        }

                        setPlzCoordsCache({ ...coordsDict });
                        const updatedData = applyCoordsToForecast([...combinedData], coordsDict);
                        setData(updatedData);
                        await GeoDB.saveReport('current_ups_data', updatedData, currentUploadName, hasForecast);
                    }
                }

                setTimeout(() => {
                    setLoadingStatus('');
                    setLoadingProgress(0);
                }, 800);
            };

            const toggleTourSelection = (tour) => {
                setSelectedTours(prev => {
                    if (prev.includes(tour)) {
                        return prev.length > 1 ? prev.filter(t => t !== tour) : prev;
                    } else {
                        return [...prev, tour];
                    }
                });
            };

            const clearTourSelection = () => setSelectedTours([]);

            // ============================================================================
            // MORNING EXPRESS DISPOSITION ENGINE (Smart Clustering, Tour Board & SLA ETA)
            // ============================================================================
            const getRegionalCorridorTour = (plzStr, lat, lng) => {
                const plzNum = parseInt(String(plzStr || '').trim(), 10);
                if (!isNaN(plzNum)) {
                    // 1. Dresden-Zentrum & Altstadt / Neustadt
                    if ((plzNum >= 1067 && plzNum <= 1099) || (plzNum >= 1307 && plzNum <= 1309)) {
                        return 'T-01 DD-Zentrum';
                    }
                    // 2. Dresden-Nord & Flughafen / Klotzsche / Radeberg / Ottendorf / Kamenz
                    if ((plzNum >= 1108 && plzNum <= 1139) || (plzNum >= 1454 && plzNum <= 1499) || (plzNum >= 1896 && plzNum <= 1936)) {
                        return 'T-02 DD-Nord & Airport';
                    }
                    // 3. Dresden-West / Friedrichstadt / Cotta / Cossebaude / Radebeul / Coswig
                    if ((plzNum >= 1156 && plzNum <= 1169) || (plzNum >= 1445 && plzNum <= 1449) || plzNum === 1640) {
                        return 'T-03 DD-West & Radebeul';
                    }
                    // 4. Dresden-Süd / Plauen / Prohlis / Lockwitz / Bannewitz
                    if ((plzNum >= 1187 && plzNum <= 1259) || plzNum === 1728) {
                        return 'T-04 DD-Süd & Prohlis';
                    }
                    // 5. Dresden-Ost / Blasewitz / Laubegast / Bühlau / Weißig
                    if (plzNum >= 1277 && plzNum <= 1328) {
                        return 'T-05 DD-Ost & Elbhang';
                    }
                    // 6. West-Achse: Meißen / Weinböhla / Nossen / Riesa / Großenhain
                    if ((plzNum >= 1558 && plzNum <= 1639) || (plzNum >= 1662 && plzNum <= 1689)) {
                        return 'T-06 Meißen & Riesa';
                    }
                    // 7. Süd-West: Freital / Wilsdruff / Tharandt / Dippoldiswalde / Altenberg
                    if ((plzNum >= 1705 && plzNum <= 1723) || (plzNum >= 1731 && plzNum <= 1778)) {
                        return 'T-07 Freital & Erzgebirge';
                    }
                    // 8. Süd-Ost: Heidenau / Pirna / Sächsische Schweiz / Sebnitz
                    if (plzNum >= 1780 && plzNum <= 1877) {
                        return 'T-08 Pirna & Heidenau';
                    }
                }
                // Fallback via coordinates relative to Dresden center
                if (lat && lng) {
                    if (lng < 13.60) return 'T-06 Meißen & Riesa';
                    if (lng > 13.86) return 'T-08 Pirna & Heidenau';
                    if (lat > 51.10) return 'T-02 DD-Nord & Airport';
                    if (lat < 51.01) return 'T-04 DD-Süd & Prohlis';
                }
                return 'T-01 DD-Zentrum';
            };

            const optimizeTourStopSequence = (rowsForTour) => {
                if (!rowsForTour || rowsForTour.length === 0) return [];
                const stopGroups = new Map();
                rowsForTour.forEach(r => {
                    const key = normalizeAddressKey(r.street, r.postalCode, r.city) || `${(r.lat || 0).toFixed(4)}_${(r.lng || 0).toFixed(4)}`;
                    if (!stopGroups.has(key)) {
                        stopGroups.set(key, { key, lat: r.lat, lng: r.lng, commit: r.commit || 'EOD', items: [r] });
                    } else {
                        const g = stopGroups.get(key);
                        g.items.push(r);
                        const order = { '09:00': 1, '10:30': 2, '12:00': 3, '14:00': 4, 'EOD': 5 };
                        if ((order[r.commit] || 9) < (order[g.commit] || 9)) {
                            g.commit = r.commit;
                        }
                    }
                });

                const unvisited = Array.from(stopGroups.values());
                const commitWeight = (c) => c === '09:00' ? 1 : c === '10:30' ? 2 : (c === '12:00' || c === '14:00') ? 3 : 4;
                const orderedGroups = [];
                let curLat = DEPOT_LAT;
                let curLng = DEPOT_LNG;

                while (unvisited.length > 0) {
                    const minTier = Math.min(...unvisited.map(u => commitWeight(u.commit)));
                    const candidates = unvisited.filter(u => commitWeight(u.commit) === minTier);
                    let bestIdx = 0;
                    let bestDist = Infinity;
                    candidates.forEach(cand => {
                        const { distanceKm } = calculateDistanceAndDriveTime(curLat, curLng, cand.lat, cand.lng);
                        if (distanceKm < bestDist) {
                            bestDist = distanceKm;
                            bestIdx = unvisited.indexOf(cand);
                        }
                    });
                    const chosen = unvisited.splice(bestIdx, 1)[0];
                    orderedGroups.push(chosen);
                    curLat = chosen.lat || curLat;
                    curLng = chosen.lng || curLng;
                }

                const result = [];
                orderedGroups.forEach((g, idx) => {
                    const newSeq = idx + 1;
                    g.items.forEach(item => {
                        result.push({ ...item, seq: newSeq });
                    });
                });
                return result;
            };

            const persistUpdatedData = async (nextData, nextToursList = null) => {
                const computedTours = nextToursList || [...new Set([...tours, ...nextData.map(r => r.tour)])].filter(t => {
                    if (t === 'Prognosen (Vorladung)') return nextData.some(r => r.tour === t);
                    return true;
                }).sort();
                setData(nextData);
                setTours(computedTours);
                setSelectedTours(prev => {
                    const merged = [...new Set([...prev.filter(t => computedTours.includes(t)), ...computedTours])];
                    return merged.length > 0 ? merged : computedTours;
                });
                try {
                    await GeoDB.saveReport('current_ups_data', nextData, fileName || 'Disposition', isForecastMode);
                } catch (e) {
                    console.error('Persist error', e);
                }
            };

            const handleCreateNewTour = async (customName) => {
                const rawName = (customName !== undefined ? customName : newTourInput).trim();
                const finalName = rawName || `Tour ${tours.filter(t => t !== 'Prognosen (Vorladung)').length + 1}`;
                if (!tours.includes(finalName)) {
                    const nextTours = [...tours, finalName].sort();
                    setTours(nextTours);
                    setSelectedTours(prev => [...new Set([...prev, finalName])]);
                }
                setActiveAssignTour(finalName);
                setNewTourInput('');
                showToast(`✓ Tour "${finalName}" bereit zur Zuweisung`);
            };

            const handleAssignStopOrPlz = async (targetItem, targetTourName, mode = 'stop') => {
                if (!targetTourName) {
                    showToast('⚠️ Bitte zuerst eine Ziel-Tour auswählen oder anlegen!');
                    return;
                }
                const targetAddrKey = normalizeAddressKey(targetItem.street, targetItem.postalCode, targetItem.city);
                const targetPlz = targetItem.postalCode;
                let movedCount = 0;

                let nextData = data.map(row => {
                    const match = mode === 'plz'
                        ? (row.postalCode === targetPlz && row.tour === targetItem.tour)
                        : mode === 'single'
                            ? (row._uid === targetItem._uid)
                            : (normalizeAddressKey(row.street, row.postalCode, row.city) === targetAddrKey && row.tour === targetItem.tour);
                    if (match) {
                        movedCount++;
                        return { ...row, tour: targetTourName };
                    }
                    return row;
                });

                // Re-sequence the target tour automatically so SLA order stays clean
                const targetRows = optimizeTourStopSequence(nextData.filter(r => r.tour === targetTourName));
                const otherRows = nextData.filter(r => r.tour !== targetTourName);
                nextData = [...otherRows, ...targetRows];

                await persistUpdatedData(nextData);
                showToast(`⚡ ${movedCount} Sendung(en) → ${targetTourName}`);
            };

            const handleBulkAssignPlzToTour = async (plz, targetTourName, onlyFromUnassigned = false) => {
                if (!targetTourName || !plz) return;
                let movedCount = 0;
                let nextData = data.map(row => {
                    if (row.postalCode === plz && (!onlyFromUnassigned || row.tour === 'Prognosen (Vorladung)')) {
                        movedCount++;
                        return { ...row, tour: targetTourName };
                    }
                    return row;
                });
                const targetRows = optimizeTourStopSequence(nextData.filter(r => r.tour === targetTourName));
                const otherRows = nextData.filter(r => r.tour !== targetTourName);
                nextData = [...otherRows, ...targetRows];
                await persistUpdatedData(nextData);
                showToast(`📦 PLZ ${plz} (${movedCount} Pakete) → ${targetTourName}`);
            };

            const handleOptimizeSingleTour = async (tourName) => {
                const targetRows = optimizeTourStopSequence(data.filter(r => r.tour === tourName));
                const otherRows = data.filter(r => r.tour !== tourName);
                const nextData = [...otherRows, ...targetRows];
                await persistUpdatedData(nextData);
                showToast(`🧭 Route für "${tourName}" nach SLA (09:00 → 10:30 → 12:00) & Bestweg optimiert!`);
            };

            const handleOptimizeAllTours = async () => {
                const grouped = {};
                data.forEach(r => {
                    if (!grouped[r.tour]) grouped[r.tour] = [];
                    grouped[r.tour].push(r);
                });
                let nextData = [];
                Object.keys(grouped).forEach(tName => {
                    if (tName === 'Prognosen (Vorladung)') {
                        nextData = nextData.concat(grouped[tName]);
                    } else {
                        nextData = nextData.concat(optimizeTourStopSequence(grouped[tName]));
                    }
                });
                await persistUpdatedData(nextData);
                showToast(`⚡ Alle Touren nach SLA-Zeitfenstern & kürzester Strecke optimiert!`);
            };

            const handleResetAllToPool = async () => {
                if (!confirm('Alle Sendungen wieder zurück in "Prognosen (Vorladung)" legen?')) return;
                const nextData = data.map((r, i) => ({
                    ...r,
                    tour: 'Prognosen (Vorladung)',
                    seq: i + 1
                }));
                setTours(['Prognosen (Vorladung)']);
                setSelectedTours(['Prognosen (Vorladung)']);
                setActiveAssignTour('');
                setData(nextData);
                await GeoDB.saveReport('current_ups_data', nextData, fileName || 'Disposition', isForecastMode);
                showToast('↺ Alle Sendungen zurück im Pool "Prognosen (Vorladung)"');
            };

            const handleRunAutoDisposition = async (mode = autoClusterMode, numTours = autoClusterCount) => {
                if (!data.length) return;
                // Take either unassigned rows, or all rows if nothing is in Prognosen (Vorladung)
                const hasPool = data.some(r => r.tour === 'Prognosen (Vorladung)');
                const poolRows = hasPool ? data.filter(r => r.tour === 'Prognosen (Vorladung)') : [...data];
                const fixedRows = hasPool ? data.filter(r => r.tour !== 'Prognosen (Vorladung)') : [];

                if (poolRows.length === 0) return;

                let assignedPool = [];
                if (mode === 'corridors') {
                    assignedPool = poolRows.map(r => ({
                        ...r,
                        tour: getRegionalCorridorTour(r.postalCode, r.lat, r.lng)
                    }));
                } else {
                    // K-Means Geographic + SLA Balanced Clustering into `numTours` tours
                    const k = Math.max(2, Math.min(20, Number(numTours) || 6));
                    const stopMap = new Map();
                    poolRows.forEach(r => {
                        const key = normalizeAddressKey(r.street, r.postalCode, r.city) || `${r.lat}_${r.lng}`;
                        if (!stopMap.has(key)) {
                            stopMap.set(key, { key, lat: r.lat || DEPOT_LAT, lng: r.lng || DEPOT_LNG, rows: [r] });
                        } else {
                            stopMap.get(key).rows.push(r);
                        }
                    });
                    const uniqueStops = Array.from(stopMap.values());
                    // Sort stops by angle around Dresden center to initialize well-spread centroids
                    const centerLat = uniqueStops.reduce((s, x) => s + x.lat, 0) / (uniqueStops.length || 1);
                    const centerLng = uniqueStops.reduce((s, x) => s + x.lng, 0) / (uniqueStops.length || 1);
                    uniqueStops.sort((a, b) => Math.atan2(a.lat - centerLat, a.lng - centerLng) - Math.atan2(b.lat - centerLat, b.lng - centerLng));

                    const centroids = [];
                    for (let i = 0; i < k; i++) {
                        const pick = uniqueStops[Math.floor((i * uniqueStops.length) / k)] || { lat: DEPOT_LAT, lng: DEPOT_LNG };
                        centroids.push({ lat: pick.lat, lng: pick.lng });
                    }

                    let assignments = new Array(uniqueStops.length).fill(0);
                    for (let iter = 0; iter < 8; iter++) {
                        const clusterSums = Array.from({ length: k }, () => ({ lat: 0, lng: 0, count: 0 }));
                        uniqueStops.forEach((st, idx) => {
                            let bestC = 0;
                            let bestDist = Infinity;
                            centroids.forEach((c, cIdx) => {
                                const d = Math.hypot(st.lat - c.lat, (st.lng - c.lng) * 0.7);
                                if (d < bestDist) {
                                    bestDist = d;
                                    bestC = cIdx;
                                }
                            });
                            assignments[idx] = bestC;
                            clusterSums[bestC].lat += st.lat;
                            clusterSums[bestC].lng += st.lng;
                            clusterSums[bestC].count += 1;
                        });
                        for (let cIdx = 0; cIdx < k; cIdx++) {
                            if (clusterSums[cIdx].count > 0) {
                                centroids[cIdx].lat = clusterSums[cIdx].lat / clusterSums[cIdx].count;
                                centroids[cIdx].lng = clusterSums[cIdx].lng / clusterSums[cIdx].count;
                            }
                        }
                    }

                    uniqueStops.forEach((st, idx) => {
                        const tourLabel = `Tour ${String(assignments[idx] + 1).padStart(2, '0')}`;
                        st.rows.forEach(r => {
                            assignedPool.push({ ...r, tour: tourLabel });
                        });
                    });
                }

                // Group all rows by tour and optimize each tour's sequence (09:00 -> 10:30 -> 12:00 -> EOD)
                const allCombined = [...fixedRows, ...assignedPool];
                const byTour = {};
                allCombined.forEach(r => {
                    if (!byTour[r.tour]) byTour[r.tour] = [];
                    byTour[r.tour].push(r);
                });

                let finalData = [];
                const finalTours = Object.keys(byTour).sort();
                finalTours.forEach(tName => {
                    finalData = finalData.concat(optimizeTourStopSequence(byTour[tName]));
                });

                setData(finalData);
                setTours(finalTours);
                setSelectedTours(finalTours);
                if (finalTours.length > 0) setActiveAssignTour(finalTours[0]);
                await GeoDB.saveReport('current_ups_data', finalData, fileName || 'Disposition', isForecastMode);
                showToast(`🤖 Smart Auto-Disposition abgeschlossen: ${poolRows.length} Sendungen auf ${finalTours.length} Touren verteilt & SLA-optimiert!`);
            };

            // Live Tour Board Summary & SLA Feasibility Calculation per Tour
            const dispositionTourBoard = useMemo(() => {
                if (!data.length) return [];
                const [startH, startM] = (routeStartTime || '08:00').split(':').map(Number);
                const baseStartMins = (startH || 8) * 60 + (startM || 0);
                const stopDur = Number(serviceStopDuration) || 3;

                const allTourNames = [...new Set([...tours, ...data.map(r => r.tour)])].sort((a, b) => {
                    if (a === 'Prognosen (Vorladung)') return -1;
                    if (b === 'Prognosen (Vorladung)') return 1;
                    return a.localeCompare(b);
                });

                return allTourNames.map((tName, tIdx) => {
                    const rows = data.filter(r => r.tour === tName).sort((a, b) => a.seq - b.seq);
                    const isPool = tName === 'Prognosen (Vorladung)';
                    const stopMap = new Map();
                    let count0900 = 0, count1030 = 0, count1200 = 0, countEod = 0, countBdr = 0;

                    rows.forEach(r => {
                        if (r.commit === '09:00') count0900++;
                        else if (r.commit === '10:30') count1030++;
                        else if (r.commit === '12:00' || r.commit === '14:00') count1200++;
                        else countEod++;
                        if (r.status && r.status.includes('DRIVER RELEASE')) countBdr++;

                        const key = normalizeAddressKey(r.street, r.postalCode, r.city) || `${r.seq}_${r.lat}`;
                        if (!stopMap.has(key)) {
                            stopMap.set(key, {
                                key,
                                seq: r.seq,
                                lat: r.lat,
                                lng: r.lng,
                                postalCode: r.postalCode,
                                city: r.city,
                                street: r.street,
                                recipient: r.recipient,
                                commit: r.commit || 'EOD',
                                service: r.service,
                                pkgCount: 1,
                                rows: [r]
                            });
                        } else {
                            const st = stopMap.get(key);
                            st.pkgCount++;
                            st.rows.push(r);
                            const order = { '09:00': 1, '10:30': 2, '12:00': 3, '14:00': 4, 'EOD': 5 };
                            if ((order[r.commit] || 9) < (order[st.commit] || 9)) {
                                st.commit = r.commit;
                                st.service = r.service;
                            }
                        }
                    });

                    const uniqueStops = Array.from(stopMap.values());
                    let curMins = baseStartMins;
                    let prevLat = DEPOT_LAT;
                    let prevLng = DEPOT_LNG;
                    let totalKm = 0;
                    let slaConflicts = 0;
                    let tightStops = 0;
                    const cachedOsrm = osrmRoutings[tName];

                    const stopSchedule = uniqueStops.map((st, idx) => {
                        let distanceKm = 0;
                        let driveTime = 0;
                        if (cachedOsrm && cachedOsrm.legData && cachedOsrm.legData[idx]) {
                            distanceKm = cachedOsrm.legData[idx].distanceKm;
                            driveTime = cachedOsrm.legData[idx].driveTime;
                        } else {
                            const fallback = calculateDistanceAndDriveTime(prevLat, prevLng, st.lat, st.lng);
                            distanceKm = fallback.distanceKm * 1.28; // Real-road detour factor when OSRM is still loading
                            driveTime = fallback.driveTime;
                        }
                        totalKm += distanceKm;
                        curMins += driveTime;
                        const etaH = Math.floor(curMins / 60);
                        const etaM = curMins % 60;
                        const etaStr = `${String(etaH).padStart(2, '0')}:${String(etaM).padStart(2, '0')}`;

                        let commitMins = 23 * 60 + 59;
                        if (st.commit && st.commit.includes(':')) {
                            const [ch, cm] = st.commit.split(':').map(Number);
                            commitMins = ch * 60 + cm;
                        }
                        const bufferMins = commitMins - curMins;
                        if (!isPool && st.commit !== 'EOD') {
                            if (bufferMins < 0) slaConflicts++;
                            else if (bufferMins <= 12) tightStops++;
                        }
                        curMins += stopDur;
                        prevLat = st.lat || prevLat;
                        prevLng = st.lng || prevLng;

                        return {
                            ...st,
                            stopIndex: idx + 1,
                            distanceKm: distanceKm.toFixed(1),
                            driveTime,
                            etaStr,
                            bufferMins
                        };
                    });

                    const finishStr = stopSchedule.length > 0 ? stopSchedule[stopSchedule.length - 1].etaStr : routeStartTime;
                    const navStops = stopSchedule.slice(0, 10);
                    const waypointsStr = navStops.slice(0, -1).map(s => `${s.lat},${s.lng}`).join('|');
                    const lastStop = navStops[navStops.length - 1];
                    const googleNavUrl = lastStop
                        ? `https://www.google.com/maps/dir/?api=1&origin=${DEPOT_LAT},${DEPOT_LNG}&destination=${lastStop.lat},${lastStop.lng}${waypointsStr ? '&waypoints=' + encodeURIComponent(waypointsStr) : ''}&travelmode=driving`
                        : '';

                    const plzSet = [...new Set(rows.map(r => r.postalCode).filter(Boolean))];
                    const color = isPool ? '#64748b' : TOUR_LINE_COLORS[tIdx % TOUR_LINE_COLORS.length];

                    return {
                        tour: tName,
                        isPool,
                        color,
                        hasRealRoad: !!(cachedOsrm && cachedOsrm.fullRoadGeom),
                        totalPackages: rows.length,
                        totalStops: uniqueStops.length,
                        count0900,
                        count1030,
                        count1200,
                        countEod,
                        countBdr,
                        totalKm: (cachedOsrm && cachedOsrm.totalRoadKm) ? cachedOsrm.totalRoadKm : totalKm.toFixed(1),
                        finishStr,
                        slaConflicts,
                        tightStops,
                        plzList: plzSet,
                        googleNavUrl,
                        stopSchedule,
                        driverName: (tourDriverMeta[tName] && tourDriverMeta[tName].driver) || '',
                        vehicle: (tourDriverMeta[tName] && tourDriverMeta[tName].vehicle) || ''
                    };
                });
            }, [data, tours, routeStartTime, serviceStopDuration, tourDriverMeta, osrmRoutings]);

            const handleCopyDriverWhatsApp = (tourSummary) => {
                if (!tourSummary) return;
                const lines = [
                    `📦 *UPS EXPRESS-MANIFEST: ${tourSummary.tour}*`,
                    tourSummary.driverName ? `👤 Fahrer: ${tourSummary.driverName}` : null,
                    `⏱ Abfahrt Depot: ${routeStartTime} Uhr | Stopps: ${tourSummary.totalStops} (${tourSummary.totalPackages} Pakete) | ~${tourSummary.totalKm} km`,
                    `🔴 09:00: ${tourSummary.count0900} | 🟣 10:30: ${tourSummary.count1030} | 🟠 12:00: ${tourSummary.count1200}`,
                    `-----------------------------------`,
                    ...tourSummary.stopSchedule.map(st =>
                        `${st.stopIndex}. [${st.commit}] ETA ${st.etaStr} — ${st.postalCode} ${st.city}, ${st.street} ${st.recipient ? '(' + st.recipient + ')' : ''} [${st.pkgCount} Pkt]`
                    ),
                    `-----------------------------------`,
                    tourSummary.googleNavUrl ? `🧭 Google Maps Route:\n${tourSummary.googleNavUrl}` : ''
                ].filter(Boolean).join('\n');

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(lines);
                    showToast(`📲 Fahrer-Manifest für "${tourSummary.tour}" in Zwischenablage kopiert (für WhatsApp / Telegram)!`);
                }
            };

            const handleExportAllDispositionCSV = () => {
                const exportRows = [];
                dispositionTourBoard.forEach(tb => {
                    tb.stopSchedule.forEach(st => {
                        st.rows.forEach(r => {
                            exportRows.push({
                                Tour: tb.tour,
                                Fahrer: tb.driverName || '',
                                Stopp_Nr: st.stopIndex,
                                Commit_SLA: st.commit,
                                Prognose_ETA: st.etaStr,
                                Puffer_Min: st.bufferMins,
                                PLZ: r.postalCode,
                                Ort: r.city,
                                Strasse: r.street,
                                Empfaenger: r.recipient || '',
                                Tracking_Nr: r.trackingNr || '',
                                Service: r.service || ''
                            });
                        });
                    });
                });
                exportCSV('UPS_Express_Disposition_Tourenplan', exportRows);
                showToast('📥 Kompletter Tourenplan als CSV exportiert!');
            };

            const mapData = useMemo(() => {
                if (!selectedTours.length || !data.length) return {};
                const grouped = {};
                selectedTours.forEach(tour => {
                    grouped[tour] = data.filter(r => r.tour === tour).sort((a, b) => {
                        if (a.seq !== b.seq) return a.seq - b.seq;
                        return a.startTime - b.startTime;
                    });
                });
                return grouped;
            }, [data, selectedTours]);

            const selectedExpressDetails = useMemo(() => {
                if (!selectedTours.length || !data.length) return [];

                const timeVal = (t) => {
                    if (t && t.includes(':')) {
                        const parts = t.split(':').map(Number);
                        return parts[0] * 60 + parts[1];
                    }
                    return 9999;
                };

                return data.filter(r => {
                    if (!selectedTours.includes(r.tour) || !r.isExpress) return false;
                    const expCat = getExpressCategory(r.service, r.commit);
                    if (expCat && !expFilters[expCat]) return false;
                    return true;
                }).map(r => {
                    let state = 'Punktlich';
                    let commitTimeStr = r.commit || 'EOD';
                    const timeOnly = r.endStr ? r.endStr.split(' ')[1] : null;
                    if (timeOnly && commitTimeStr !== 'EOD' && !r.isForecast) {
                        const [h, m] = timeOnly.split(':').map(Number);
                        const [ch, cm] = commitTimeStr.split(':').map(Number);
                        if (h > ch || (h === ch && m > cm)) state = 'Verspaetet';
                    }
                    if (r.status.includes('DATA NOT AVAILABLE') || r.status.includes('VOID')) state = 'Ausnahme';
                    if (r.isForecast) state = 'Prognose';
                    const isBDR = r.status.includes('DRIVER RELEASE');
                    return { tour: r.tour, seq: r.seq, service: r.service, commit: commitTimeStr, actual: r.isForecast ? '--:--' : (timeOnly || '--:--'), state, location: r.city + ', ' + r.street, isBDR };
                }).sort((a, b) => timeVal(a.commit) - timeVal(b.commit) || a.tour.localeCompare(b.tour) || a.seq - b.seq);
            }, [data, selectedTours, expFilters]);

            const slaAndPickups = useMemo(() => {
                if (!data.length) return { violations: [], pickups: [] };
                const violations = [];
                const pickups = [];
                data.forEach(r => {
                    if (r.isForecast) return;
                    if (r.isExpress && r.commit && r.endTime && (r.status.includes('SIGNATURE') || r.status.includes('RELEASE') || r.status.includes('DELIVERED'))) {
                        let commitTime = new Date(r.endTime);
                        let hasCommit = false;
                        if (r.commit && r.commit !== 'EOD') {
                            const [ch, cm] = r.commit.split(':').map(Number);
                            commitTime.setHours(ch, cm, 0);
                            hasCommit = true;
                        }
                        if (hasCommit && r.endTime > commitTime.getTime()) {
                            const delayMins = Math.round((r.endTime - commitTime.getTime()) / 60000);
                            violations.push({ tour: r.tour, seq: r.seq, service: r.service, location: r.city + ', ' + r.street + ' ' + r.house, commitTimeStr: r.commit, actualTimeStr: r.endStr ? (r.endStr.split(' ')[1] || r.endStr) : '--:--', delayMins });
                        }
                    }
                    if (r.type && (r.type.includes('PICKUP') || r.type.includes('ODS'))) {
                        let readyTimeStr = "Kein Zeitfenster";
                        if (r.pickupReady && !r.pickupReady.includes('4712')) readyTimeStr = r.pickupReady.split(' ')[1] || r.pickupReady;
                        pickups.push({ tour: r.tour, seq: r.seq, type: r.type, location: r.city + ', ' + r.street + ' ' + r.house, status: r.status, actualTimeStr: r.startStr ? (r.startStr.split(' ')[1] || r.startStr) : '--:--', readyTimeStr });
                    }
                });
