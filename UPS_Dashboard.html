                await GeoDB.saveReport('current_ups_data', finalData, fileName || 'Disposition', isForecastMode);
                const modeLabel = mode === 'stours' ? 'Reale S-Touren (S01–S42 Oktober-ZIV)' : mode === 'corridors' ? '8 Regional-Korridore' : `${numTours} K-Means Cluster`;
                showToast(`⚡ Auto-Disposition (${modeLabel}): ${poolRows.length} Sendungen auf ${finalTours.length} Touren verteilt & SLA-optimiert!`);
            };

            // Live Tour Board Summary & SLA Feasibility Calculation per Tour
            const dispositionTourBoard = useMemo(() => {
                if (!data.length) return [];
                const [startH, startM] = (routeStartTime || '08:00').split(':').map(Number);
                const baseStartMins = (startH || 8) * 60 + (startM || 0);
                const stopDur = Number(serviceStopDuration) || 3;
                const zivTours = (typeof SVD_ZIV_INTELLIGENCE !== 'undefined' && SVD_ZIV_INTELLIGENCE.tours) ? SVD_ZIV_INTELLIGENCE.tours : {};

                const allTourNames = [...new Set([...tours, ...data.map(r => r.tour)])].filter(tName => {
                    if (tName === 'Prognosen (Vorladung)') return data.some(r => r.tour === tName);
                    return true;
                });

                const boardList = allTourNames.map((tName, tIdx) => {
                    const rows = data.filter(r => r.tour === tName).sort((a, b) => a.seq - b.seq);
                    const isPool = tName === 'Prognosen (Vorladung)';
                    const zMeta = zivTours[tName] || {};
                    const stopMap = new Map();
                    let count0900 = 0, count1030 = 0, count1200 = 0, countEod = 0, countBdr = 0;

                    rows.forEach(r => {
                        if (r.commit === '09:00') count0900++;
                        else if (r.commit === '10:30') count1030++;
                        else if (r.commit === '12:00' || r.commit === '14:00') count1200++;
                        else countEod++;
                        if (r.status && r.status.includes('DRIVER RELEASE')) countBdr++;

                        const key = normalizeAddressKey(r.street, r.postalCode, r.city) || `${r.seq}_${r.lat}`;
                        if (!stopMap.has(key)) {
                            const zivInfo = getHistoricalSTourInfo(r.street, r.postalCode, r.lat, r.lng);
                            stopMap.set(key, {
                                key,
                                seq: r.seq,
                                lat: r.lat,
                                lng: r.lng,
                                postalCode: r.postalCode,
                                city: r.city,
                                street: r.street,
                                recipient: r.recipient,
                                commit: r.commit || 'EOD',
                                service: r.service,
                                pkgCount: 1,
                                histPrimaryTour: r.nativeTour || zivInfo.primaryTour,
                                histAltTour: zivInfo.altTour,
                                springerTour: zivInfo.springerTour,
                                histMatchSource: zivInfo.matchSource,
                                rows: [r]
                            });
                        } else {
                            const st = stopMap.get(key);
                            st.pkgCount++;
                            st.rows.push(r);
                            const order = { '09:00': 1, '10:30': 2, '12:00': 3, '14:00': 4, 'EOD': 5 };
                            if ((order[r.commit] || 9) < (order[st.commit] || 9)) {
                                st.commit = r.commit;
                                st.service = r.service;
                            }
                        }
                    });

                    const uniqueStops = Array.from(stopMap.values());
                    let curMins = baseStartMins;
                    let prevLat = DEPOT_LAT;
                    let prevLng = DEPOT_LNG;
                    let totalKm = 0;
                    let slaConflicts = 0;
                    let tightStops = 0;
                    let redirectedStops = 0;
                    const cachedOsrm = osrmRoutings[tName];

                    const stopSchedule = uniqueStops.map((st, idx) => {
                        let distanceKm = 0;
                        let driveTime = 0;
                        if (cachedOsrm && cachedOsrm.legData && cachedOsrm.legData[idx]) {
                            distanceKm = cachedOsrm.legData[idx].distanceKm;
                            driveTime = cachedOsrm.legData[idx].driveTime;
                        } else {
                            const fallback = calculateDistanceAndDriveTime(prevLat, prevLng, st.lat, st.lng);
                            distanceKm = fallback.distanceKm * 1.28;
                            driveTime = fallback.driveTime;
                        }
                        totalKm += distanceKm;
                        curMins += driveTime;
                        const etaH = Math.floor(curMins / 60);
                        const etaM = curMins % 60;
                        const etaStr = `${String(etaH).padStart(2, '0')}:${String(etaM).padStart(2, '0')}`;

                        let commitMins = 23 * 60 + 59;
                        if (st.commit && st.commit.includes(':')) {
                            const [ch, cm] = st.commit.split(':').map(Number);
                            commitMins = ch * 60 + cm;
                        }
                        const bufferMins = commitMins - curMins;
                        if (!isPool && st.commit !== 'EOD') {
                            if (bufferMins < 0) slaConflicts++;
                            else if (bufferMins <= 12) tightStops++;
                        }
                        if (!isPool && st.histPrimaryTour && st.histPrimaryTour !== tName) {
                            redirectedStops++;
                        }
                        curMins += stopDur;
                        prevLat = st.lat || prevLat;
                        prevLng = st.lng || prevLng;

                        return {
                            ...st,
                            stopIndex: idx + 1,
                            distanceKm: distanceKm.toFixed(1),
                            driveTime,
                            etaStr,
                            bufferMins
                        };
                    });

                    const finishStr = stopSchedule.length > 0 ? stopSchedule[stopSchedule.length - 1].etaStr : routeStartTime;
                    const navStops = stopSchedule.slice(0, 10);
                    const waypointsStr = navStops.slice(0, -1).map(s => `${s.lat},${s.lng}`).join('|');
                    const lastStop = navStops[navStops.length - 1];
                    const googleNavUrl = lastStop
                        ? `https://www.google.com/maps/dir/?api=1&origin=${DEPOT_LAT},${DEPOT_LNG}&destination=${lastStop.lat},${lastStop.lng}${waypointsStr ? '&waypoints=' + encodeURIComponent(waypointsStr) : ''}&travelmode=driving`
                        : '';

                    const plzSet = [...new Set(rows.map(r => r.postalCode).filter(Boolean))];
                    const color = isPool ? '#64748b' : TOUR_LINE_COLORS[tIdx % TOUR_LINE_COLORS.length];

                    return {
                        tour: tName,
                        isPool,
                        isSpringer: !!zMeta.isSpringer || tName.endsWith('H'),
                        areaName: zMeta.area || '',
                        avgFirstStop: zMeta.avgFirstStop || '',
                        stopsPerHour: zMeta.stopsPerHour || 0,
                        color,
                        hasRealRoad: !!(cachedOsrm && cachedOsrm.fullRoadGeom),
                        totalPackages: rows.length,
                        totalStops: uniqueStops.length,
                        count0900,
                        count1030,
                        count1200,
                        countEod,
                        countBdr,
                        redirectedStops,
                        totalKm: (cachedOsrm && cachedOsrm.totalRoadKm) ? cachedOsrm.totalRoadKm : totalKm.toFixed(1),
                        finishStr,
                        slaConflicts,
                        tightStops,
                        plzList: plzSet,
                        googleNavUrl,
                        stopSchedule,
                        driverName: (tourDriverMeta[tName] && tourDriverMeta[tName].driver) || zMeta.driver || '',
                        vehicle: (tourDriverMeta[tName] && tourDriverMeta[tName].vehicle) || ''
                    };
                });

                // Risk-First Sorting for Morning Dispatcher (06:30-06:45):
                // 1. Pool (if any unassigned) -> 2. SLA Conflicts -> 3. Express-Springers (S1H-S4H) -> 4. 09:00 Tours -> 5. 10:30 Tours -> 6. Alphabetical
                return boardList.sort((a, b) => {
                    if (a.isPool !== b.isPool) return a.isPool ? -1 : 1;
                    if (isForecastMode) {
                        if (a.slaConflicts !== b.slaConflicts) return b.slaConflicts - a.slaConflicts;
                        if (a.isSpringer !== b.isSpringer) return a.isSpringer ? -1 : 1;
                        if ((a.count0900 > 0) !== (b.count0900 > 0)) return b.count0900 - a.count0900;
                        if ((a.count1030 > 0) !== (b.count1030 > 0)) return b.count1030 - a.count1030;
                    }
                    return a.tour.localeCompare(b.tour);
                });
            }, [data, tours, routeStartTime, serviceStopDuration, tourDriverMeta, osrmRoutings, isForecastMode]);

            // 06:30 Exception Focus: All 09:00 Express stops & any stops with SLA conflict (bufferMins < 0)
            const criticalMorningStops = useMemo(() => {
                const list = [];
                dispositionTourBoard.forEach(tb => {
                    tb.stopSchedule.forEach(st => {
                        const isConflict = !tb.isPool && st.commit !== 'EOD' && st.bufferMins < 0;
                        const is0900 = st.commit === '09:00';
                        const isTight = !tb.isPool && st.commit !== 'EOD' && st.bufferMins >= 0 && st.bufferMins <= 10;
                        if (isConflict || is0900 || isTight) {
                            list.push({
                                ...st,
                                currentTour: tb.tour,
                                driverName: tb.driverName,
                                areaName: tb.areaName,
                                isConflict,
                                is0900,
                                isTight
                            });
                        }
                    });
                });
                return list.sort((a, b) => {
                    if (a.isConflict !== b.isConflict) return a.isConflict ? -1 : 1;
                    if (a.is0900 !== b.is0900) return a.is0900 ? -1 : 1;
                    return a.bufferMins - b.bufferMins;
                });
            }, [dispositionTourBoard]);

            // 06:45 Belt Redirections ("Umverfügungen am Sortierband"): Packages moved away from their native S01-S42 tour
            const beltRedirections = useMemo(() => {
                const list = [];
                dispositionTourBoard.forEach(tb => {
                    if (tb.isPool) return;
                    tb.stopSchedule.forEach(st => {
                        if (st.histPrimaryTour && st.histPrimaryTour !== tb.tour) {
                            list.push({
                                fromTour: st.histPrimaryTour,
                                toTour: tb.tour,
                                toDriver: tb.driverName || '',
                                isSpringerTarget: tb.isSpringer,
                                commit: st.commit,
                                etaStr: st.etaStr,
                                stopIndex: st.stopIndex,
                                postalCode: st.postalCode,
                                city: st.city,
                                street: st.street,
                                recipient: st.recipient || '',
                                pkgCount: st.pkgCount,
                                trackingNrs: st.rows.map(r => r.trackingNr).filter(Boolean).join(', '),
                                sampleRow: st.rows[0]
                            });
                        }
                    });
                });
                return list.sort((a, b) => a.fromTour.localeCompare(b.fromTour) || a.toTour.localeCompare(b.toTour));
            }, [dispositionTourBoard]);

            // 1-Click "Tour fällt heute aus" (Dissolve a cancelled tour to Neighbor S-Tours & Express-Springers)
            const handleDissolveTourToNeighbors = async (cancelledTour) => {
                const tb = dispositionTourBoard.find(x => x.tour === cancelledTour);
                if (!tb || tb.totalPackages === 0) return;

                const stopTargetMap = new Map();
                const targetSummary = {};
                tb.stopSchedule.forEach(st => {
                    let targetT = st.histAltTour && st.histAltTour !== cancelledTour ? st.histAltTour : (st.springerTour || 'S2H');
                    if (st.commit === '09:00') {
                        targetT = st.springerTour || targetT;
                    }
                    if (targetT === cancelledTour) targetT = 'S2H';
                    stopTargetMap.set(st.key, targetT);
                    targetSummary[targetT] = (targetSummary[targetT] || 0) + st.pkgCount;
                });

                const nextData = data.map(r => {
                    if (r.tour !== cancelledTour) return r;
                    const k = normalizeAddressKey(r.street, r.postalCode, r.city) || `${r.seq}_${r.lat}`;
                    const targetT = stopTargetMap.get(k) || 'S2H';
                    return { ...r, tour: targetT };
                });

                const byTour = {};
                nextData.forEach(r => {
                    if (!byTour[r.tour]) byTour[r.tour] = [];
                    byTour[r.tour].push(r);
                });
                let finalData = [];
                const finalTours = Object.keys(byTour).sort();
                finalTours.forEach(tName => {
                    finalData = finalData.concat(tName === 'Prognosen (Vorladung)' ? byTour[tName] : optimizeTourStopSequence(byTour[tName]));
                });

                await persistUpdatedData(finalData, finalTours);
                const summaryStr = Object.entries(targetSummary).map(([t, c]) => `${t} (${c})`).join(', ');
                showToast(`🔄 Tour ${cancelledTour} aufgelöst → verteilt auf: ${summaryStr}`);
            };

            const handleCopyBeltSheetWhatsApp = () => {
                const springerTours = dispositionTourBoard.filter(tb => tb.isSpringer && tb.totalStops > 0);
                const stops0900 = criticalMorningStops.filter(s => s.is0900);

                const lines = [
                    `📢 *UPS 06:45 BAND-ANWEISUNG & EXPRESS-DISPO*`,
                    `📅 Datei: ${fileName || 'Vorladung'} | Abfahrt: ${routeStartTime} Uhr`,
                    `===================================`,
                    `🔀 *1. UMVERFÜGUNGEN AM SORTIERBAND (${beltRedirections.length} Stopps)*`,
                    beltRedirections.length === 0
                        ? `✓ Keine Umverfügungen — alle Pakete bleiben auf ihren Stamm-Touren (S01–S42)!`
                        : beltRedirections.map((b, idx) =>
                            `${idx + 1}. *Aus ${b.fromTour} ➔ In ${b.toTour}* [${b.commit}] — ${b.postalCode} ${b.city}, ${b.street} ${b.recipient ? '(' + b.recipient + ')' : ''} [${b.pkgCount} Pkt]`
                        ).join('\n'),
                    `===================================`,
                    `🔴 *2. 09:00 UHR EXPRESS-CHECKLISTE (${stops0900.length} Stopps)*`,
                    stops0900.length === 0
                        ? `✓ Keine 09:00 Uhr Express-Sendungen heute.`
                        : stops0900.map((s, idx) =>
                            `${idx + 1}. *${s.currentTour}* (${s.driverName || 'Fahrer'}) | ETA ${s.etaStr} — ${s.postalCode} ${s.city}, ${s.street} ${s.recipient ? '(' + s.recipient + ')' : ''}`
                        ).join('\n'),
                    ...(springerTours.length > 0 ? [
                        `===================================`,
                        `⚡ *3. EXPRESS-SPRINGER TOUREN (${springerTours.map(s => s.tour).join(', ')})*`,
                        ...springerTours.map(sp => [
                            `\n🚐 *${sp.tour}* ${sp.driverName ? '(' + sp.driverName + ')' : ''} — ${sp.totalStops} Stopps (${sp.totalPackages} Pkt) | ~${sp.totalKm} km`,
                            ...sp.stopSchedule.map(st => `  ${st.stopIndex}. [${st.commit}] ETA ${st.etaStr} (aus ${st.histPrimaryTour}) — ${st.postalCode} ${st.city}, ${st.street} ${st.recipient ? '(' + st.recipient + ')' : ''}`),
                            sp.googleNavUrl ? `  🧭 Route: ${sp.googleNavUrl}` : ''
                        ].filter(Boolean).join('\n'))
                    ] : [])
                ].join('\n');

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(lines);
                    showToast('📋 06:45 Band-Anweisung & Springer-Liste für WhatsApp in Zwischenablage kopiert!');
                }
            };

            // 1-Click Automatic SLA Conflict Resolver (Offloads late 09:00/10:30/12:00 stops to Neighbor S-Tour or S1H-S4H Express-Springer)
            const handleResolveSlaConflictsWithSpringer = async () => {
                const conflictStopKeys = new Map();
                dispositionTourBoard.forEach(tb => {
                    if (tb.isPool || tb.slaConflicts === 0) return;
                    tb.stopSchedule.forEach(st => {
                        if (st.commit !== 'EOD' && st.bufferMins < 0) {
                            // Prefer Express-Springer (S1H..S4H) for 09:00 conflicts or if already on a Springer, otherwise check neighbor S-tour
                            let targetT = st.springerTour || 'S2H';
                            if (st.commit !== '09:00' && st.histAltTour && st.histAltTour !== tb.tour) {
                                const altBoard = dispositionTourBoard.find(x => x.tour === st.histAltTour);
                                if (!altBoard || (altBoard.slaConflicts === 0 && altBoard.count0900 + altBoard.count1030 < 6)) {
                                    targetT = st.histAltTour;
                                }
                            }
                            if (targetT !== tb.tour) {
                                conflictStopKeys.set(`${tb.tour}|${st.key}`, targetT);
                            }
                        }
                    });
                });

                if (conflictStopKeys.size === 0) {
                    showToast('✓ Keine ungelösten SLA-Konflikte gefunden!');
                    return;
                }

                let movedPackages = 0;
                const nextData = data.map(r => {
                    const k = `${r.tour}|${normalizeAddressKey(r.street, r.postalCode, r.city) || `${r.seq}_${r.lat}`}`;
                    if (conflictStopKeys.has(k)) {
                        movedPackages++;
                        return { ...r, tour: conflictStopKeys.get(k) };
                    }
                    return r;
                });

                const byTour = {};
                nextData.forEach(r => {
                    if (!byTour[r.tour]) byTour[r.tour] = [];
                    byTour[r.tour].push(r);
                });
                let finalData = [];
                const finalTours = Object.keys(byTour).sort();
                finalTours.forEach(tName => {
                    finalData = finalData.concat(tName === 'Prognosen (Vorladung)' ? byTour[tName] : optimizeTourStopSequence(byTour[tName]));
                });

                await persistUpdatedData(finalData, finalTours);
                showToast(`🚑 ${conflictStopKeys.size} kritische Express-Stopps (${movedPackages} Pakete) auf Nachbar-/Springer-Touren (S1H–S4H) umverteilt!`);
            };

            const handleCopyDriverWhatsApp = (tourSummary) => {
                if (!tourSummary) return;
                const lines = [
                    `📦 *UPS EXPRESS-MANIFEST: ${tourSummary.tour}*`,
                    tourSummary.driverName ? `👤 Fahrer: ${tourSummary.driverName}` : null,
                    `⏱ Abfahrt Depot: ${routeStartTime} Uhr | Stopps: ${tourSummary.totalStops} (${tourSummary.totalPackages} Pakete) | ~${tourSummary.totalKm} km`,
                    `🔴 09:00: ${tourSummary.count0900} | 🟣 10:30: ${tourSummary.count1030} | 🟠 12:00: ${tourSummary.count1200}`,
                    `-----------------------------------`,
                    ...tourSummary.stopSchedule.map(st =>
                        `${st.stopIndex}. [${st.commit}] ETA ${st.etaStr}${st.histPrimaryTour && st.histPrimaryTour !== tourSummary.tour ? ` [🔀 aus ${st.histPrimaryTour}]` : ''} — ${st.postalCode} ${st.city}, ${st.street} ${st.recipient ? '(' + st.recipient + ')' : ''} [${st.pkgCount} Pkt]`
                    ),
                    `-----------------------------------`,
                    tourSummary.googleNavUrl ? `🧭 Google Maps Route:\n${tourSummary.googleNavUrl}` : ''
                ].filter(Boolean).join('\n');

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(lines);
                    showToast(`📲 Fahrer-Manifest für "${tourSummary.tour}" in Zwischenablage kopiert (für WhatsApp / Telegram)!`);
                }
            };

            const handleExportAllDispositionCSV = () => {
                const exportRows = [];
                dispositionTourBoard.forEach(tb => {
                    tb.stopSchedule.forEach(st => {
                        st.rows.forEach(r => {
                            exportRows.push({
                                Ziel_Tour: tb.tour,
                                Stamm_Tour_ZIV: st.histPrimaryTour || tb.tour,
                                Umverfuegung: (st.histPrimaryTour && st.histPrimaryTour !== tb.tour) ? `AUS ${st.histPrimaryTour} -> IN ${tb.tour}` : 'Stamm-Tour',
                                Fahrer: tb.driverName || '',
                                Stopp_Nr: st.stopIndex,
                                Commit_SLA: st.commit,
                                Prognose_ETA: st.etaStr,
                                Puffer_Min: st.bufferMins,
                                PLZ: r.postalCode,
                                Ort: r.city,
                                Strasse: r.street,
                                Empfaenger: r.recipient || '',
                                Tracking_Nr: r.trackingNr || '',
                                Service: r.service || ''
                            });

                                                                        </span>
                                                                    </td>
                                                                    <td className="p-2.5 font-bold text-gray-900">
                                                                        {b.postalCode} {b.city}, {b.street}
                                                                    </td>
                                                                    <td className="p-2.5 text-gray-700">
                                                                        <div className="font-bold">{b.recipient || '-'}</div>
                                                                        {b.trackingNrs && <div className="text-[10px] font-mono text-gray-500 truncate max-w-[200px]">{b.trackingNrs}</div>}
                                                                    </td>
                                                                    <td className="p-2.5 text-center font-black text-sm">{b.pkgCount}</td>
                                                                    <td className="p-2.5 text-right">
                                                                        <button
                                                                            onClick={() => handleAssignStopOrPlz(b.sampleRow, b.fromTour, 'stop')}
                                                                            className="text-[10px] font-bold text-indigo-700 hover:underline bg-indigo-50 px-2 py-1 rounded border border-indigo-200"
                                                                            title={`Wieder zurück an Stamm-Tour ${b.fromTour} geben`}
                                                                        >
                                                                            ↺ Zurück an {b.fromTour}
                                                                        </button>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>

                                        {/* 2. 09:00 Uhr Express-Kontrollliste */}
                                        <div className="bg-white rounded-xl border-2 border-red-200 shadow-sm overflow-hidden">
                                            <div className="bg-red-900 text-white px-4 py-2.5 flex justify-between items-center">
                                                <div className="font-black text-sm">
                                                    🔴 2. 09:00 UHR EXPRESS-KONTROLLLISTE (Persönliche Übergabe an Fahrer)
                                                </div>
                                                <span className="bg-red-600 text-white text-xs font-black px-2.5 py-0.5 rounded-full">
                                                    {stops0900.length} Stopps
                                                </span>
                                            </div>
                                            {stops0900.length === 0 ? (
                                                <div className="p-4 text-center text-xs text-gray-500 font-bold">
                                                    Keine 09:00 Uhr Express-Sendungen in dieser Datei.
                                                </div>
                                            ) : (
                                                <div className="overflow-x-auto">
                                                    <table className="min-w-full divide-y divide-gray-200 text-left text-xs">
                                                        <thead className="bg-red-50">
                                                            <tr>
                                                                <th className="p-2.5 font-black text-red-950">Tour &amp; Fahrer</th>
                                                                <th className="p-2.5 font-black text-red-950 text-center">Prognose ETA</th>
                                                                <th className="p-2.5 font-black text-red-950">Adresse</th>
                                                                <th className="p-2.5 font-black text-red-950">Empfänger</th>
                                                                <th className="p-2.5 font-black text-red-950 text-right">Schnell-Umverfügung</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-gray-100">
                                                            {stops0900.map((s, idx) => (
                                                                <tr key={idx} className={s.isConflict ? "bg-red-50/80" : ""}>
                                                                    <td className="p-2.5 font-black text-gray-900">
                                                                        <span className="bg-red-100 text-red-900 px-2 py-0.5 rounded mr-1.5">{s.currentTour}</span>
                                                                        <span className="text-gray-600 font-semibold">{s.driverName || ''}</span>
                                                                    </td>
                                                                    <td className="p-2.5 text-center font-black">
                                                                        <span className={s.isConflict ? "text-red-600 underline" : "text-emerald-700"}>
                                                                            {s.etaStr} ({s.bufferMins >= 0 ? `+${s.bufferMins}m` : `${s.bufferMins}m`})
                                                                        </span>
                                                                    </td>
                                                                    <td className="p-2.5 font-bold text-gray-800">{s.postalCode} {s.city}, {s.street}</td>
                                                                    <td className="p-2.5 text-gray-700 font-semibold">{s.recipient || '-'} ({s.pkgCount} Pkt)</td>
                                                                    <td className="p-2.5 text-right space-x-1">
                                                                        {s.histAltTour && s.histAltTour !== s.currentTour && (
                                                                            <button
                                                                                onClick={() => handleAssignStopOrPlz(s.rows[0], s.histAltTour, 'stop')}
                                                                                className="bg-amber-100 hover:bg-amber-200 text-amber-900 px-2 py-0.5 rounded text-[10px] font-black"
                                                                            >
                                                                                ↪ Nachbar {s.histAltTour}
                                                                            </button>
                                                                        )}
                                                                        {s.springerTour && s.springerTour !== s.currentTour && (
                                                                            <button
                                                                                onClick={() => handleAssignStopOrPlz(s.rows[0], s.springerTour, 'stop')}
                                                                                className="bg-indigo-600 hover:bg-indigo-700 text-white px-2 py-0.5 rounded text-[10px] font-black"
                                                                            >
                                                                                ⚡ Springer {s.springerTour}
                                                                            </button>
                                                                        )}
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>

                                        {/* 3. Express-Springer Touren (S1H-S5H) */}
                                        {springerTours.length > 0 && (
                                            <div className="space-y-3">
                                                <h4 className="font-black text-sm text-indigo-950 uppercase tracking-wider">
                                                    ⚡ 3. Aktive Express-Springer Touren ({springerTours.length})
                                                </h4>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    {springerTours.map(sp => (
                                                        <div key={sp.tour} className="bg-white rounded-xl border-2 border-indigo-300 shadow-sm p-4 space-y-2.5">
                                                            <div className="flex justify-between items-center border-b pb-2">
                                                                <div>
                                                                    <span className="bg-indigo-600 text-white font-black text-xs px-2 py-0.5 rounded mr-2">{sp.tour}</span>
                                                                    <span className="font-bold text-xs text-gray-700">{sp.driverName || 'Express-Springer'}</span>
                                                                </div>
                                                                <div className="flex items-center gap-1.5">
                                                                    <button
                                                                        onClick={() => handleCopyDriverWhatsApp(sp)}
                                                                        className="bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-black px-2.5 py-1 rounded"
                                                                    >
                                                                        📲 WhatsApp
                                                                    </button>
                                                                    {sp.googleNavUrl && (
                                                                        <a
                                                                            href={sp.googleNavUrl}
                                                                            target="_blank"
                                                                            className="bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-black px-2.5 py-1 rounded"
                                                                        >
                                                                            🧭 Google Route ↗
                                                                        </a>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            <div className="divide-y divide-gray-100 text-xs">
                                                                {sp.stopSchedule.map(st => (
                                                                    <div key={st.key} className="py-1.5 flex justify-between items-center gap-2">
                                                                        <div>
                                                                            <span className="font-black text-gray-500 mr-1">#{st.stopIndex}</span>
                                                                            <span className="font-black text-red-700 mr-1">[{st.commit}]</span>
                                                                            <span className="font-bold text-gray-900">{st.postalCode} {st.city}, {st.street}</span>
                                                                            {st.recipient && <span className="text-gray-500 ml-1">({st.recipient})</span>}
                                                                        </div>
                                                                        <span className="bg-indigo-50 text-indigo-800 px-1.5 py-0.5 rounded text-[10px] font-black shrink-0">
                                                                            aus {st.histPrimaryTour}
                                                                        </span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* Модальное окно настроек Google Maps Platform API */}
                    {showApiModal && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                            <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-gray-200 overflow-hidden">
                                <div className="bg-[#351C15] text-white p-4 flex justify-between items-center">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xl">🗺️</span>
                                        <h3 className="font-bold text-base">Google Maps Platform — API &amp; Karten Einstellungen</h3>
                                    </div>
                                    <button onClick={() => setShowApiModal(false)} className="text-white/80 hover:text-white font-bold text-lg px-2">✕</button>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Google Cloud API-Key (wird in SQLite `ups_cache.db` gespeichert)</label>
                                        <input
                                            type="text"
                                            value={googleApiKey}
                                            onChange={(e) => setGoogleApiKey(e.target.value)}
                                            placeholder="AIzaSy..."
                                            className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none"
                                        />
                                        <p className="text-[11px] text-gray-500 mt-1">
                                            Wird für <b>Google Geocoding API (ROOFTOP)</b>, <b>Maps Embed / Street View</b> und <b>GPS-Kontrolle</b> verwendet. Alle abgerufenen Koordinaten werden dauerhaft in `ups_cache.db` gecacht.
                                        </p>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 uppercase mb-2">Standard-Kartenansicht</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={() => handleSwitchMapTile('g_road')} className={"p-2.5 rounded-lg border text-xs font-bold text-left " + (mapTileType === 'g_road' ? 'bg-blue-50 border-blue-500 text-blue-800' : 'border-gray-200 text-gray-700')}>
                                                🗺️ Google Straßenkarte
                                            </button>
                                            <button onClick={() => handleSwitchMapTile('g_traffic')} className={"p-2.5 rounded-lg border text-xs font-bold text-left " + (mapTileType === 'g_traffic' ? 'bg-red-50 border-red-500 text-red-800' : 'border-gray-200 text-gray-700')}>
                                                🚦 Google Live-Verkehr
                                            </button>
                                            <button onClick={() => handleSwitchMapTile('g_hybrid')} className={"p-2.5 rounded-lg border text-xs font-bold text-left " + (mapTileType === 'g_hybrid' ? 'bg-indigo-50 border-indigo-500 text-indigo-800' : 'border-gray-200 text-gray-700')}>
                                                🛰️ Google Satellit / Hybrid
                                            </button>
                                            <button onClick={() => handleSwitchMapTile('osm')} className={"p-2.5 rounded-lg border text-xs font-bold text-left " + (mapTileType === 'osm' ? 'bg-emerald-50 border-emerald-500 text-emerald-800' : 'border-gray-200 text-gray-700')}>
                                                🌍 OpenStreetMap
                                            </button>
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-2 pt-3 border-t">
                                        <button
                                            onClick={async () => {
                                                await saveGoogleKeyToDb(googleApiKey);
                                                setShowApiModal(false);
                                            }}
                                            className="bg-[#FFB500] hover:bg-yellow-500 text-[#351C15] font-bold px-5 py-2 rounded-lg text-sm shadow-sm"
                                        >
                                            💾 Speichern in DB
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Модальное окно Google Street View / Спутник для точки доставки */}
                    {streetViewStop && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 md:p-10">
                            <div className="bg-white w-full h-full max-w-6xl max-h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden border-4 border-white">
                                <div className="bg-slate-900 p-4 text-white flex justify-between items-center shrink-0">
                                    <div>
                                        <h3 className="font-bold text-base">🛣️ Google Street View &amp; Zufahrtskontrolle: {streetViewStop.tour} | #{streetViewStop.seq}</h3>
                                        <p className="text-xs text-slate-300">{streetViewStop.recipient ? `${streetViewStop.recipient} — ` : ''}{streetViewStop.address}</p>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <a
                                            href={`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${streetViewStop.lat},${streetViewStop.lng}`}
                                            target="_blank"
                                            className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-lg"
                                        >
                                            ↗ Vollbild Street View
                                        </a>
                                        <button onClick={() => setStreetViewStop(null)} className="w-9 h-9 rounded-full bg-white/10 hover:bg-red-500 text-white font-bold">✕</button>
                                    </div>
                                </div>
                                <div className="flex-1 grid grid-cols-1 lg:grid-cols-2 bg-gray-100">
                                    <iframe
                                        className="w-full h-full border-0 min-h-[300px]"
                                        src={googleApiKey
                                            ? `https://www.google.com/maps/embed/v1/streetview?key=${googleApiKey}&location=${streetViewStop.lat},${streetViewStop.lng}&heading=0&pitch=0&fov=90`
                                            : `https://maps.google.com/maps?q=${streetViewStop.lat},${streetViewStop.lng}&hl=de&z=19&t=k&output=embed`}
                                        allowFullScreen
                                        loading="lazy"
                                    ></iframe>
                                    <iframe
                                        className="w-full h-full border-0 min-h-[300px] border-t lg:border-t-0 lg:border-l border-gray-300"
                                        src={`https://maps.google.com/maps?q=${encodeURIComponent(streetViewStop.address || (streetViewStop.lat + ',' + streetViewStop.lng))}&hl=de&z=19&t=h&output=embed`}
                                        allowFullScreen
                                        loading="lazy"
                                    ></iframe>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Модальное окно просмотра GPS-нарушения */}
                    {selectedGpsDev && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 md:p-10 animate-in fade-in duration-200">
                            <div className="bg-white w-full h-full rounded-2xl shadow-2xl flex flex-col overflow-hidden relative border-4 border-white">
                                {/* Header */}
                                <div className="bg-slate-900 p-4 text-white flex justify-between items-center shrink-0">
                                    <div className="flex items-center gap-3">
                                        <div className="bg-blue-600 p-2 rounded-lg">
                                            <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-lg leading-tight">GPS-Kontrolle: #{selectedGpsDev.seq}</h3>
                                            <p className="text-xs text-slate-400 font-medium">{selectedGpsDev.address}</p>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => setSelectedGpsDev(null)}
                                        className="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-red-500 transition-colors text-white"
                                    >
                                        <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                                    </button>
                                </div>

                                {/* Content Area */}
                                <div className="flex-1 flex flex-col md:flex-row relative">
                                    {/* Iframe */}
                                    <div className="flex-1 bg-gray-100 relative min-h-[300px]">
                                        {googleApiKey ? (
                                            <iframe
                                                className="w-full h-full border-0"
                                                src={`https://www.google.com/maps/embed/v1/directions?key=${googleApiKey}&origin=${selectedGpsDev.planLat},${selectedGpsDev.planLng}&destination=${selectedGpsDev.lat},${selectedGpsDev.lng}&mode=driving&units=metric`}
                                                allowFullScreen
                                                loading="lazy"
                                            ></iframe>
                                        ) : (
                                            <div className="absolute inset-0 flex flex-col items-center justify-center p-10 text-center">
                                                <div className="bg-red-50 p-6 rounded-2xl border border-red-200 border-dashed">
                                                    <span className="text-4xl mb-4 block">🔑</span>
                                                    <h4 className="font-bold text-red-800 text-lg">Kein API-Key gefunden</h4>
                                                    <p className="text-red-600 text-sm mt-2 max-w-sm">
                                                        Bitte geben Sie Ihren Google Maps API-Key im Dashboard ein, чтобы использовать встроенные карты.
                                                    </p>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Sidebar Info */}
                                    <div className="w-full md:w-80 shrink-0 bg-gray-50 border-t md:border-t-0 md:border-l p-6 overflow-y-auto">
                                        <div className="space-y-6">
                                            <div>
                                                <div className="text-[10px] uppercase font-black text-gray-400 tracking-widest mb-1">Status</div>
                                                <div className="bg-white border p-3 rounded-xl shadow-sm">
                                                    <div className="font-bold text-gray-800">{selectedGpsDev.status}</div>
                                                    <div className="text-[11px] text-teal-600 font-bold mt-1">{selectedGpsDev.service}</div>
                                                </div>
                                            </div>

                                            <div>
                                                <div className="text-[10px] uppercase font-black text-gray-400 tracking-widest mb-1 text-red-500">Abweichung</div>
                                                <div className="bg-red-50 border border-red-100 p-3 rounded-xl shadow-sm flex items-baseline gap-2">
                                                    <span className="text-2xl font-black text-red-600">{selectedGpsDev.distance.toLocaleString('de-DE')}</span>
                                                    <span className="text-xs font-bold text-red-400">Meter</span>
                                                </div>
                                            </div>

                                            <div className="pt-4 border-t border-gray-200">
                                                <h4 className="text-xs font-bold text-gray-500 mb-3">Punkte Details:</h4>
                                                <div className="space-y-4">
                                                    <div className="flex gap-3">
                                                        <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 shrink-0 font-bold text-xs">P</div>
                                                        <div>
                                                            <div className="text-[10px] font-black text-gray-400 uppercase">Plan-Adresse</div>
                                                            <div className="text-xs font-bold text-gray-700 leading-tight">{selectedGpsDev.address}</div>
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-3">
                                                        <div className="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-600 shrink-0 font-bold text-xs">S</div>
                                                        <div>
                                                            <div className="text-[10px] font-black text-gray-400 uppercase">Scan-Ort</div>
                                                            <div className="text-xs font-bold text-gray-700 leading-tight">Gespielte Koordinate</div>
                                                            <div className="text-[10px] text-gray-400 mt-1">{selectedGpsDev.lat.toFixed(6)}, {selectedGpsDev.lng.toFixed(6)}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="pt-6">
                                                <a
                                                    href={`https://www.google.com/maps/dir/?api=1&origin=${selectedGpsDev.planLat},${selectedGpsDev.planLng}&destination=${selectedGpsDev.lat},${selectedGpsDev.lng}&travelmode=driving`}
                                                    target="_blank"
                                                    className="w-full bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 py-3 rounded-xl shadow-sm text-xs font-bold flex items-center justify-center gap-2 transition-all"
                                                >
                                                    ↗ In neuem Tab öffnen
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <UPSDispositionDashboard />
            </ErrorBoundary>
        );
    </script>
</body>

</html>
